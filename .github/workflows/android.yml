name: Build Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: Build
        id: build
        continue-on-error: true
        working-directory: medical-center/android
        run: gradle assembleDebug --no-daemon --stacktrace > ../../build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with: {name: zahraa-clinic-apk, path: medical-center/android/app/build/outputs/apk/debug/*.apk}
      - name: Publish APK / log to branch "apk"
        run: |
          mkdir /tmp/out && cp build.log /tmp/out/build.log
          cp medical-center/android/app/build/outputs/apk/debug/*.apk /tmp/out/zahraa-clinic.apk 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b apk && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "build output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
