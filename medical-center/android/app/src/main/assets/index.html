js", "c": "/* ============ المصروفات التشغيلية: إدارة البيانات / السجل / الاعتماد والسداد / بنود الصرف / التقارير / الإعدادات / الدليل ============ */\n'use strict';\nconst OPX_ST = {draft: 'مسودة', wait: 'بانتظار الاعتماد', ok: 'معتمد', no: 'مرفوض'};\nconst OPX_KIND = {\n  resp: {t: 'المسؤولون', xl: 'الإدارة / الوظيفة', p: 'RSP-', i: '👤'},\n  dept: {t: 'الإدارات', xl: 'ملاحظات', p: 'DPT-', i: '🏛️'},\n  center: {t: 'مراكز التكلفة', xl: 'الإدارة', p: 'CC-', i: '🧮'},\n  method: {t: 'طرق السداد', xl: 'ملاحظات', p: 'PM-', i: '💳'},\n  item: {t: 'بنود الصرف', xl: 'التصنيف', p: 'BND-', i: '🏷️'}\n};\nconst OPX_DEF = {\n  dept: [['الإدارة المالية', ''], ['الإدارة الطبية', ''], ['الإدارة العامة', '']],\n  center: [['مركز التكلفة الرئيسي', 'الإدارة المالية']],\n  method: [['نقدي', ''], ['تحويل بنكي', ''], ['شيك', ''], ['محفظة إلكترونية', '']],\n  item: [['مستلزمات مكتبية', 'مكتبية'], ['صيانة', 'تشغيلية'], ['خدمات', 'تشغيلية']]\n};\nconst opset = k => S.data.opset.filter(x => x.kind === k && !(x.active === false || x.active === 'false' || x.active === '0'));\nconst opsetNames = k => opset(k).map(x => x.name);\nconst opxPays = r => { try { const a = JSON.parse(r.pays || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };\nconst opxPaid = r => opxPays(r).reduce((t, p) => t + (+p.amount || 0), 0);\nconst opxAppr = r => r.status === 'ok' ? (+r.amount || 0) : 0;\nconst opxRest = r => r.status === 'ok' ? Math.max(0, (+r.amount || 0) - opxPaid(r)) : 0;\nconst opxLate = r => r.status === 'ok' && r.dueDate && validDate(r.dueDate) && r.dueDate \u003c today() && opxRest(r) > 0.005;\nconst opxStTag = r => `\u003cspan class=\"tag c-${{draft: 'blue', wait: 'cyan', ok: 'lime', no: 'red'}[r.status] || 'blue'}\">${OPX_ST[r.status] || OPX_ST.wait}\u003c/span>`;\nconst opxPayTag = r => { if (r.status !== 'ok') return '\u003cspan class=\"muted\">—\u003c/span>'; const p = opxPaid(r), rest = opxRest(r); return rest \u003c= 0.005 ? '\u003cspan class=\"tag c-lime\">مدفوع كلياً\u003c/span>' : (p > 0 ? '\u003cspan class=\"tag c-orange\">مدفوع جزئياً\u003c/span>' : '\u003cspan class=\"tag c-red\">غير مدفوع\u003c/span>') + (opxLate(r) ? ' \u003cspan class=\"tag c-pink\">متأخر\u003c/span>' : ''); };\nconst opxCfg = (name, d) => { const x = S.data.opset.find(r => r.kind === 'cfg' && r.ref === name); return x ? x.name : d; };\nconst opxPrefix = () => opxCfg('prefix', 'EX-');\nconst opxNext = () => { const p = opxPrefix(); let m = 0; S.data.opx.forEach(r => { const mt = String(r.no || '').match(/(\\d+)$/); if (mt) m = Math.max(m, +mt[1]); }); return p + String(m + 1).padStart(4, '0'); };\nconst opxF = () => (S.opf = S.opf || {st: '', dept: '', item: '', pay: '', q: ''});\nconst opxList = () => {\n  const {from, to} = getRange(), f = opxF(), q = f.q.trim().toLowerCase();\n  return S.data.opx.filter(r => r.date >= from && r.date \u003c= to && (!f.st || r.status === f.st) && (!f.dept || r.dept === f.dept) && (!f.item || r.item === f.item)\n    && (!f.pay || (f.pay === 'late' ? opxLate(r) : f.pay === 'paid' ? r.status === 'ok' && opxRest(r) \u003c= 0.005 : f.pay === 'part' ? r.status === 'ok' && opxPaid(r) > 0 && opxRest(r) > 0.005 : r.status === 'ok' && opxPaid(r) === 0))\n    && (!q || JSON.stringify(r).toLowerCase().includes(q))).sort((a, b) => b.date.localeCompare(a.date) || String(b.no).localeCompare(String(a.no)));\n};\nconst opxTot = rs => ({appr: sum(rs, opxAppr), paid: sum(rs.filter(r => r.status === 'ok'), opxPaid), rest: sum(rs, opxRest), wait: rs.filter(r => r.status === 'wait').length, late: rs.filter(opxLate).length, total: sum(rs, r => +r.amount || 0)});\nconst opxRing = t => { const p = t.appr > 0 ? Math.round(t.paid / t.appr * 100) : 0; return `\u003cdiv class=\"ringbox\">\u003cdiv class=\"ring\" style=\"--p:${Math.min(100, p)}\">\u003cb>${p}%\u003c/b>\u003c/div>\u003cdiv>\u003cb>نسبة السداد\u003c/b>\u003cbr>\u003csmall>${fmtN(t.paid)} من ${fmtN(t.appr)}\u003c/small>\u003c/div>\u003c/div>`; };\nconst opxKpis = (t, extra) => kpiRow([['المعتمد', fmtN(t.appr), 'orange'], ['المدفوع', fmtN(t.paid), 'lime'], ['المتبقي', fmtN(t.rest), 'red'], ['بانتظار الاعتماد', t.wait, 'cyan'], ['متأخرة في السداد', t.late, 'pink']].concat(extra || []));\nconst opxDeny = () => { $('#main').innerHTML = '\u003cdiv class=\"panel\">⛔ لا تملك صلاحية فتح هذه الشاشة\u003c/div>'; };\n\n/* أي قيمة جديدة تُكتب في الإدارة / البند / مركز التكلفة / طريقة السداد تُضاف تلقائياً للقوائم */\nasync function opxEnsure(kind, name, extra) {\n  name = String(name || '').trim(); if (!name || S.data.opset.some(x => x.kind === kind && x.name === name)) return;\n  let m = 0; S.data.opset.filter(x => x.kind === kind).forEach(x => { const mt = String(x.ref || '').match(/(\\d+)$/); if (mt) m = Math.max(m, +mt[1]); });\n  const r = await API.call('save', {entity: 'opset', record: {kind, ref: OPX_KIND[kind].p + String(m + 1).padStart(3, '0'), name, extra: extra || '', active: true}}); upsertLocal('opset', r.record);\n}\nasync function opxEnsureAll(v) { await opxEnsure('dept', v.dept); await opxEnsure('item', v.item); await opxEnsure('center', v.center, v.dept); }\n/* إضافة مصروف سريعة (نافذة) من أي شاشة مصروفات */\nActs.opxnew = () => {\n  const f = (k, l, extra, val) => fieldHTML(Object.assign({k, l}, extra || {}), val == null ? '' : val);\n  const m = modal(`\u003ch3>➕ مصروف جديد\u003c/h3>\u003cdiv class=\"grid\">${f('date', 'تاريخ المصروف', {t: 'date'}, today())}${f('dept', 'الإدارة', {req: 1, sg: 'opx_dept'})}${f('item', 'بند الصرف', {req: 1, sg: 'opx_item'})}${f('center', 'مركز التكلفة', {sg: 'opx_center'})}${f('vendor', 'المورد / المستفيد', {sg: 'opx_vendor'})}${f('invoiceNo', 'مرجع الفاتورة')}${f('dueDate', 'تاريخ الاستحقاق', {t: 'date'})}${f('amount', 'المبلغ', {t: 'num', req: 1})}${f('desc', 'البيان', {t: 'area'})}\u003c/div>\u003cp class=\"muted\">اكتب أي إدارة أو بند جديد وسيُضاف تلقائياً للقوائم.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn c-lime\" id=\"qok\">💾 حفظ\u003c/button>\u003cbutton class=\"btn ghost\" id=\"qcl\">إلغاء\u003c/button>\u003c/div>`);\n  $('#qcl', m).onclick = () => m.remove();\n  $('#qok', m).onclick = e => guard(e.target, async () => {\n    const v = readForm(m); if (!String(v.dept || '').trim() || !String(v.item || '').trim()) throw new Error('الإدارة وبند الصرف مطلوبان'); if (!(+v.amount > 0)) throw new Error('اكتب مبلغاً صحيحاً'); if (!validDate(v.date)) throw new Error('تاريخ المصروف: الصيغة yyyy/mm/dd');\n    await opxEnsureAll(v);\n    const rec = {no: opxNext(), date: v.date, dept: String(v.dept).trim(), item: String(v.item).trim(), center: v.center || '', vendor: v.vendor || '', invoiceNo: v.invoiceNo || '', dueDate: v.dueDate || '', amount: +v.amount, desc: v.desc || '', status: 'wait', pays: '', attach: ''};\n    const r = await API.call('save', {entity: 'opx', record: rec}); upsertLocal('opx', r.record); m.remove(); toast('تم حفظ المصروف ✔'); S.view && S.view.refresh && S.view.refresh();\n  });\n};\nconst opxAddBtn = '\u003cbutton class=\"btn c-orange\" data-act=\"opxnew\">➕ مصروف جديد\u003c/button>';\n\n/* القوائم الافتراضية (تُنشأ مرة واحدة عند أول فتح) */\nasync function opxSeed() {\n  if (S.opxSeeded || S.data.opset.length || !(S.user && (S.user.isAdmin || can('opx_set')))) return; S.opxSeeded = true;\n  try {\n    const recs = []; for (const k of Object.keys(OPX_DEF)) { let n = 0; for (const [name, extra] of OPX_DEF[k]) recs.push({kind: k, ref: OPX_KIND[k].p + String(++n).padStart(3, '0'), name, extra, active: true}); }\n    recs.push({kind: 'cfg', ref: 'prefix', name: 'EX-', extra: '', active: true});\n    if (S.user.isAdmin) await API.call('bulk_save', {entity: 'opset', records: recs, key: 'kind,name'}); else for (const r of recs) await API.call('save', {entity: 'opset', record: r});\n    await loadAll(['opset']);\n  } catch (e) {}\n}\n\n/* ---------- إدارة البيانات (إدخال/تعديل المصروف) ---------- */\nSCREEN_RENDER.opx_data = async function (a) { await opxSeed(); return _opxData(a); };\nconst _opxData = crud({k: 'opx_data', ent: 'opx', t: 'إدارة المصروفات التشغيلية', i: '💳', c: 'orange', add: 'مصروف جديد', dated: true,\n  fields: [\n    {k: 'no', l: 'رقم المصروف (تلقائي)', t: 'ro'}, {k: 'date', l: 'تاريخ المصروف', t: 'date', req: 1},\n    {k: 'dept', l: 'الإدارة', req: 1, sg: 'opx_dept', ph: 'اكتب أو اختر — الجديد يُسجَّل تلقائياً'},\n    {k: 'item', l: 'بند الصرف', req: 1, sg: 'opx_item', ph: 'اكتب أو اختر — الجديد يُسجَّل تلقائياً'},\n    {k: 'center', l: 'مركز التكلفة', sg: 'opx_center', ph: 'اكتب أو اختر'},\n    {k: 'vendor', l: 'المورد / المستفيد', sg: 'opx_vendor'}, {k: 'invoiceNo', l: 'مرجع الفاتورة'}, {k: 'dueDate', l: 'تاريخ الاستحقاق', t: 'date'},\n    {k: 'amount', l: 'المبلغ', t: 'num', req: 1}, {k: 'status', l: 'حالة الاعتماد', t: 'sel', opts: () => Object.keys(OPX_ST).map(k => ({v: k, l: OPX_ST[k]}))},\n    {k: 'desc', l: 'البيان', t: 'area'}, {k: 'attach', l: 'المرفق (فاتورة / مستند)', t: 'img'},\n    {k: '_h', t: 'html', html: () => '\u003cinput type=\"hidden\" name=\"pays\">\u003cinput type=\"hidden\" name=\"approvedBy\">\u003cinput type=\"hidden\" name=\"approvedAt\">'}],\n  cols: [{h: 'رقم المصروف', f: r => `\u003cb>${esc(r.no)}\u003c/b>`}, {h: 'التاريخ', f: r => esc(r.date)}, {h: 'البند', f: r => esc(r.item)}, {h: 'الإدارة', f: r => esc(r.dept)}, {h: 'المورد', f: r => esc(r.vendor)}, {h: 'المبلغ', f: r => fmtN(r.amount), sum: r => r.amount}, {h: 'الاعتماد', f: opxStTag}, {h: 'السداد', f: opxPayTag}, {h: 'المدفوع', f: r => fmtN(opxPaid(r)), sum: opxPaid}, {h: 'المتبقي', f: r => fmtN(opxRest(r)), sum: opxRest}, {h: 'المرفق', f: r => thumb(r.attach)}],\n  sort: (a, b) => b.date.localeCompare(a.date) || String(b.no).localeCompare(String(a.no)),\n  before: raw => opxEnsureAll(raw),\n  defaults: () => ({no: opxNext(), date: today(), status: 'wait'}),\n  collect: raw => { const o = Object.fromEntries(Object.entries(raw).filter(([k]) => !k.startsWith('_'))); o.no = raw.no || opxNext(); if (o.status === 'ok' && !o.approvedBy) { o.approvedBy = S.user.username; o.approvedAt = today(); } return o; },\n  validate: (r, ed) => { const old = ed ? S.data.opx.find(x => x.id === ed) : null; if (old && +r.amount \u003c opxPaid(old)) return 'المبلغ أقل من المدفوع فعلياً (' + fmtN(opxPaid(old)) + ')'; if (!(+r.amount > 0)) return 'اكتب مبلغاً صحيحاً'; return ''; }\n});\n\n/* ---------- عرض بطاقة المصروف + الاعتماد + السداد ---------- */\nasync function opxSave(r, patch) { const x = await API.call('save', {entity: 'opx', record: Object.assign({}, r, patch)}); if (!upsertLocal('opx', x.record)) await loadAll(['opx']); S.view && S.view.refresh && await S.view.refresh(); }\nActs.opxview = el => {\n  const r = S.data.opx.find(x => x.id === el.dataset.id); if (!r) return;\n  const ps = opxPays(r), t = opxTot([r]);\n  const m = modal(`\u003ch3>🧾 مصروف ${esc(r.no)} — ${esc(r.item)} ${opxStTag(r)}\u003c/h3>\n    ${kpiRow([['قيمة المصروف', fmtN(r.amount), 'orange'], ['المدفوع', fmtN(opxPaid(r)), 'lime'], ['المتبقي', fmtN(opxRest(r)), 'red']])}\n    \u003ctable>\u003ctbody>\u003ctr>\u003cth>التاريخ\u003c/th>\u003ctd>${esc(r.date)}\u003c/td>\u003cth>الاستحقاق\u003c/th>\u003ctd>${esc(r.dueDate) || '—'}\u003c/td>\u003c/tr>\u003ctr>\u003cth>الإدارة\u003c/th>\u003ctd>${esc(r.dept)}\u003c/td>\u003cth>مركز التكلفة\u003c/th>\u003ctd>${esc(r.center) || '—'}\u003c/td>\u003c/tr>\u003ctr>\u003cth>المورد\u003c/th>\u003ctd>${esc(r.vendor) || '—'}\u003c/td>\u003cth>مرجع الفاتورة\u003c/th>\u003ctd>${esc(r.invoiceNo) || '—'}\u003c/td>\u003c/tr>\u003ctr>\u003cth>البيان\u003c/th>\u003ctd colspan=\"3\">${esc(r.desc) || '—'}\u003c/td>\u003c/tr>\u003ctr>\u003cth>السداد\u003c/th>\u003ctd>${opxPayTag(r)}\u003c/td>\u003cth>الاعتماد\u003c/th>\u003ctd>${r.approvedBy ? esc(r.approvedBy) + ' — ' + esc(r.approvedAt) : '—'}\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n    ${r.attach ? `\u003cdiv class=\"imgfld\" style=\"margin:8px 0\">${thumb(r.attach)}\u003c/div>` : ''}\n    \u003ch4>جدول الدفعات\u003c/h4>\u003ctable>\u003cthead>\u003ctr>\u003cth>التاريخ\u003c/th>\u003cth>المبلغ\u003c/th>\u003cth>الطريقة\u وفات المعتمدة فقط في الجداول الأولى.\u003c/small>\u003c/div>` + tabs + body;\n});\nActs.opxrtab = el => { S.opxRep = el.dataset.v; S.view.refresh(); };\n\n/* ---------- دليل الاستخدام + هيكل العمل ---------- */\nSCREEN_RENDER.guide = () => {\n  const st = [['1', 'تهيئة القوائم', 'من الإعدادات أضف الإدارات ومراكز التكلفة وطرق السداد والمسؤولين، ومن بنود الصرف أضف البنود.', 'opx_set', '⚙️ إعدادات المصروفات', 'violet'],\n    ['2', 'تسجيل المصروف', 'من إدارة المصروفات اختر الإدارة والبند وأدخل المبلغ والمورد وأرفق الفاتورة ثم احفظ.', 'opx_data', '💳 مصروف جديد', 'orange'],\n    ['3', 'مراجعة المستندات', 'راجع الفاتورة والمرفقات في سجل المصروفات قبل الاعتماد.', 'opx_reg', '📒 سجل المصروفات', 'gold'],\n    ['4', 'توثيق الاعتماد', 'من الاعتماد والسداد اعتمد المصروف أو ارفضه — يُسجَّل المعتمِد والتاريخ.', 'opx_apr', '✅ الاعتماد والسداد', 'lime'],\n    ['5', 'تسجيل الدفعات', 'سجّل الدفعات الفعلية (كلية أو جزئية) بطريقة السداد ومرجع السند.', 'opx_apr', '💰 تسجيل الدفعات', 'teal'],\n    ['6', 'متابعة التقارير', 'استخدم التقارير حسب البند والإدارة وغير المدفوع وبانتظار الاعتماد.', 'opx_rep', '📊 التقارير', 'pink']];\n  $('#main').innerHTML = `${pageHead('دليل الاستخدام وهيكل العمل', '📖', 'blue')}\u003cdiv class=\"panel accent c-orange\">\u003cb>هيكل العمل:\u003c/b> الإدارة ← مركز التكلفة ← بند الصرف ← المصروف ← الاعتماد ← السداد ← التقارير\u003c/div>\n  \u003cdiv class=\"grid3\">${st.map(s => `\u003cdiv class=\"panel accent c-${s[5]}\">\u003ch3>\u003cspan class=\"num\">${s[0]}\u003c/span> ${s[1]}\u003c/h3>\u003cp>${s[2]}\u003c/p>${can(s[3]) || s[3] === 'opx_rep' && can('opx_rep') ? `\u003cbutton class=\"btn sm c-${s[5]}\" data-act=\"go\" data-s=\"${s[3]}\">${s[4]}\u003c/button>` : ''}\u003c/div>`).join('')}\u003c/div>\n  \u003cdiv class=\"panel accent c-cyan\">\u003cb>قاعدة العمل:\u003c/b> الاعتماد لا يعني السداد. كل عملية منفصلة، وكل إضافة أو تعديل أو حذف يُحفظ فوراً في Google Sheets ويظهر لكل المستخدمين.\u003c/div>\n  \u003cdiv class=\"sect\">\u003ch2>الوحدات الأخرى للبرنامج\u003c/h2>\u003c/div>\u003cdiv class=\"grid2\">\u003cdiv class=\"panel\">\u003cb>🩺 الزيارات والعمليات:\u003c/b> كل عملية جراحية تُسجَّل كزيارة (مسلسل وباركود وإيصال)، وتظهر في تقارير العيادات والأطباء.\u003c/div>\u003cdiv class=\"panel\">\u003cb>🏦 التقارير المالية:\u003c/b> حركة الخزينة، حسابات الأطباء، الإجماليات بالتفصيل، تقرير اللجنة وتحليل الإيرادات.\u003c/div>\u003c/div>`;\n};\nActs.go = Acts.go || (el => nav(el.dataset.s));\n"}, {"k": "js", "c": "/* ============ شاشة الحجوزات (العيادات والعمليات) ============ */\nconst BK_ST = {booked: 'محجوز', came: 'حضر', done: 'تم', cancel: 'ملغي'};\nconst BK_STC = {booked: 'blue', came: 'orange', done: 'lime', cancel: 'red'};\nconst bkRest = r => Math.max(0, (+r.value || 0) - (+r.bpaid || 0));\nconst bkTag = r => `\u003cspan class=\"tag c-${BK_STC[r.status] || 'blue'}\">${esc(BK_ST[r.status] || 'محجوز')}\u003c/span>`;\nconst bkTurn = (date, docId, doc, ed) => S.data.bookings.filter(x => x.date === date && x.id !== ed && (docId ? x.doctorId === docId : x.doctor === doc) && x.status !== 'cancel').reduce((m, x) => Math.max(m, +x.turn || 0), 0) + 1;\n\nSCREEN_RENDER.bookings = crud({k: 'bookings', ent: 'bookings', t: 'الحجوزات', i: '📅', c: 'teal', add: 'حجز جديد', dated: true,\n  fields: [\n    {k: 'kind', l: 'نوع الحجز', t: 'seg', opts: [{v: 'عيادة', l: '🩺 عيادة', c: 'teal'}, {v: 'عملية', l: '🏥 عملية', c: 'red'}]},\n    {k: 'date', l: 'التاريخ', t: 'date', req: 1},\n    {k: 'patient', l: 'اسم المريض', req: 1, sg: 'patients.name'}, {k: 'phone', l: 'رقم التليفون', num: 1},\n    {k: 'clinic', l: 'العيادة / القسم', t: 'sel', opts: () => ['', ...clinicNames(), ...EXTRA_CLINICS].map(x => ({v: x, l: x || '— اختر —'}))},\n    {k: '_doc', l: 'الطبيب', t: 'docpick', sg: 'clinicdocs'},\n    {k: 'turn', l: 'الدور (تلقائي ويمكن تعديله)', t: 'num'},\n    {k: 'value', l: 'القيمة', t: 'num'}, {k: 'bpaid', l: 'المدفوع', t: 'num'},\n    {k: 'status', l: 'الحالة', t: 'sel', opts: () => Object.keys(BK_ST).map(k => ({v: k, l: BK_ST[k]}))},\n    {k: 'notes', l: 'ملاحظات', t: 'area'}],\n  cols: [\n    {h: 'اليوم', f: r => esc(dayName(r.date))}, {h: 'التاريخ', f: r => esc(r.date)},\n    {h: 'النوع', f: r => r.kind === 'عملية' ? '\u003cspan class=\"tag c-red\">عملية\u003c/span>' : '\u003cspan class=\"tag c-teal\">عيادة\u003c/span>'},\n    {h: 'اسم المريض', f: r => `\u003cb>${esc(r.patient)}\u003c/b>`}, {h: 'الطبيب', f: r => esc(r.doctor)},\n    {h: 'الدور', f: r => `\u003cb>${esc(r.turn || '')}\u003c/b>`},\n    {h: 'القيمة', f: r => fmtN(r.value), sum: r => r.value}, {h: 'المدفوع', f: r => fmtN(r.bpaid), sum: r => r.bpaid},\n    {h: 'المتبقي', f: r => fmtN(bkRest(r)), sum: bkRest}, {h: 'ملاحظات', f: r => esc(r.notes)}, {h: 'الحالة', f: bkTag},\n    {h: 'إجراء', f: r => r.status === 'done' || r.status === 'cancel' ? '' : `\u003cbutton type=\"button\" class=\"btn sm c-orange\" data-act=\"bkcame\" data-id=\"${r.id}\">✔ حضر\u003c/button> \u003cbutton type=\"button\" class=\"btn sm c-lime\" data-act=\"bkvisit\" data-id=\"${r.id}\">🩺 تحويل لزيارة\u003c/button>`}],\n  sort: (a, b) => a.date.localeCompare(b.date) || (+a.turn || 0) - (+b.turn || 0),\n  before: docAutoReg,\n  defaults: () => ({kind: 'عيادة', date: today(), status: 'booked', turn: bkTurn(today(), '', '')}),\n  fill: r => Object.assign({}, r, {_doc: r.doctorId || (S.data.doctors.find(d => d.name === r.doctor) || {}).id || ''}),\n  collect: raw => {\n    const d = S.data.doctors.find(x => x.id === raw._doc); const o = Object.fromEntries(Object.entries(raw).filter(([k]) => !k.startsWith('_')));\n    o.doctor = d ? d.name : ''; o.doctorId = d ? d.id : ''; o.value = +o.value || 0; o.bpaid = +o.bpaid || 0;\n    if (!(+o.turn > 0)) o.turn = bkTurn(o.date, o.doctorId, o.doctor, raw.id);\n    return o;\n  },\n  validate: r => (+r.bpaid > +r.value ? 'المدفوع أكبر من القيمة' : '')\n});\n\n/* حضر: يغيّر الحالة فقط */\nActs.bkcame = el => guard(el, async () => {\n  const r = S.data.bookings.find(x => x.id === el.dataset.id); if (!r) return;\n  const x = await API.call('save', {entity: 'bookings', record: Object.assign({}, r, {status: 'came'})}); upsertLocal('bookings', x.record); S.view && S.view.refresh && S.view.refresh(); toast('تم تسجيل الحضور');\n});\n/* تحويل الحجز إلى زيارة نقدية بنفس البيانات (عملية ← «عمليات جراحية» / عيادة ← «كشف») */\nActs.bkvisit = el => guard(el, async () => {\n  const r = S.data.bookings.find(x => x.id === el.dataset.id); if (!r) return;\n  if (!r.clinic) throw new Error('حدّد العيادة / القسم في الحجز أولاً (تعديل الحجز)');\n  if (!confirm('تحويل حجز «' + r.patient + '» إلى زيارة؟')) return;\n  const sg = r.kind === 'عملية';\n  const rec = {date: r.date, patient: r.patient, phone: r.phone || '', clinic: r.clinic, doctor: r.doctor || '', doctorId: r.doctorId || '', visitType: sg ? 'عمليات جراحية' : 'كشف', value: +r.value || 0, category: 'cash', paid: +r.bpaid || 0, notes: r.notes || ''};\n  if (sg) rec.operation = r.notes || 'عملية';\n  const v = await API.call('save', {entity: 'visits', record: rec}); upsertLocal('visits', v.record);\n  const x = await API.call('save', {entity: 'bookings', record: Object.assign({}, r, {status: 'done'})}); upsertLocal('bookings', x.record);\n  S.view && S.view.refresh && S.view.refresh(); toast('تم إنشاء الزيارة رقم ' + (v.record.serial || '') + ' ✔');\n});\n"}, {"k": "js", "c": "/* ===== شريط الأذكار (أعلى) + شريط حسابات اليوم (أسفل) ===== */\nconst AZK_M = ['أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير',\n  'اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور',\n  'اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت',\n  'رضيت بالله ربا وبالإسلام دينا وبمحمد صلى الله عليه وسلم نبيا',\n  'اللهم عافني في بدني، اللهم عافني في سمعي، اللهم عافني في بصري، لا إله إلا أنت',\n  'بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم',\n  'سبحان الله وبحمده، سبحان الله العظيم',\n  'أستغفر الله العظيم وأتوب إليه',\n  'حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم',\n  'اللهم صل وسلم على نبينا محمد'];\nconst AZK_E = ['أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير',\n  'اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير',\n  'اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت',\n  'أعوذ بكلمات الله التامات من شر ما خلق',\n  'اللهم إني أسألك العفو والعافية في الدنيا والآخرة',\n  'بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم',\n  'سبحان الله وبحمده، سبحان الله العظيم',\n  'أستغفر الله العظيم وأتوب إليه',\n  'يا حي يا قيوم برحمتك أستغيث، أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين',\n  'اللهم صل وسلم على نبينا محمد'];\nconst Bars = (() => {\n  let top, bot, txt, mute, started = false;\n  const ls = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};\n  let muted = ls.get('azk_mute') === '1';\n  const list = () => new Date().getHours() \u003c 12 ? AZK_M : AZK_E;\n  const kind = () => new Date().getHours() \u003c 12 ? 'm' : 'e';\n  /* ---- النص: كل الأذكار وراء بعض في سطر واحد متحرك ---- */\n  let shownKind = '';\n  const paintText = () => {\n    if (!txt || shownKind === kind()) return; shownKind = kind();\n    const pre = kind() === 'm' ? '🌅 أذكار الصباح: ' : '🌙 أذكار المساء: ', t = pre + list().join('   ✦   ') + '   ✦   ';\n    txt.textContent = t; txt.style.animation = 'none'; void txt.offsetWidth; txt.style.animation = `azkmove ${Math.max(60, Math.round(t.length * .22))}s linear infinite`;\n  };\n  /* ---- الصوت: ملفات متتابعة (مرفق/حسن صالح ثم قرآن الصباح) ---- */\n  const YT_AZK = '2Xf0kDLa8RE', YT_QURAN = 'RZ1x5UjAMZQ';\n  let au = null, yt = null, ytReady = false, cur = -1, fails = 0, customUrls = [], customId = '', retryBound = false, playing = false;\n  const SHA = '75f3439f6fbe692e9d7c489524777b22b38c2f7c', DEF = [1, 2].map(n => `https://raw.githubusercontent.com/asalam4a-hue/medical-system/${SHA}/medical-center/web/audio/azkar${n}.mp3`);\n  const tracks = () => (customUrls.length ? customUrls : DEF).map(u => ({url: u}));\n  const loadCustom = async () => {\n    try { const id = (window.S && S.settings && S.settings.azkAudio) || window.AZK_AUDIO_ID || ''; if (id === customId) return; customId = id; customUrls = []; for (const x of String(id).split(',').filter(Boolean)) customUrls.push(await fileURL(x)); } catch (e) { customUrls = []; }\n  };\n  const stopAll = () => { try { if (au) au.pause(); } catch (e) {} try { if (yt && yt.pauseVideo) yt.pauseVideo(); } catch (e) {} };\n  const ytInit = cb => {\n    if (ytReady) return cb();\n    const go = () => {\n      const d = document.createElement('div'); d.id = 'azkyt'; d.style.cssText = 'position:fixed;left:-9999px;bottom:0;width:200px;height:120px;opacity:0;pointer-events:none'; const h = document.createElement('div'); h.id = 'azkyt_p'; d.appendChild(h); document.body.appendChild(d);\n      yt = new YT.Player('azkyt_p', {width: 200, height: 120, playerVars: {autoplay: 1, controls: 0, playsinline: 1, rel: 0}, events: {\n        onReady: () => { ytReady = true; cb(); },\n        onStateChange: e => { if (e.data === 0 && cur >= 0 && tracks()[cur] && tracks()[cur].yt) advance(); },\n        onError: () => { fails++; advance(); }}});\n    };\n    if (window.YT && YT.Player) return go();\n    const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if (prev) prev(); go(); };\n    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.onerror = () => { fails++; advance(); }; document.head.appendChild(sc);\n  };\n  const advance = () => { if (!tracks().length) { playing = false; return; } cur = (cur + 1) % tracks().length; if (fails >= tracks().length * 2) { playing = false; return; } playTrack(); };\n  const playTrack = () => {\n    if (!S.user || muted || !playing) return; const t = tracks()[cur]; if (!t) return;\n    stopAll();\n    if (t.url) {\n      if (!au) { au = new Audio(); au.onended = advance; au.onerror = () => { fails++; advance(); }; }\n      if (au.src !== t.url) au.src = t.url;\n      const pr = au.play(); if (pr && pr.catch) pr.catch(() => bindRetry()); fails = 0;\n    } else ytInit(() => { try { if (yt.getVideoData && yt.getVideoData().video_id === t.yt && yt.playVideo) { yt.unMute(); yt.playVideo(); } else yt.loadVideoById(t.yt); setTimeout(() => { try { if (yt.getPlayerState() === -1 || yt.getPlayerState() === 5) bindRetry(); else fails = 0; } catch (e) {} }, 4000); } catch (e) { fails++; advance(); } });\n  };\n  const bindRetry = () => { if (retryBound) return; retryBound = true; const h = () => { retryBound = false; document.removeEventListener('click', h, true); if (!muted && S.user) { if (cur \u003c 0) cur = 0; playing = true; playTrack(); } }; document.addEventListener('click', h, true); };\n  const startAudio = async () => { await loadCustom(); if (cur \u003c 0) cur = 0; playing = true; fails = 0; playTrack(); };\n  const stats = () => {\n    try {\n      const t = today(), vs = visitsIn(t, t), st = statementRows(t, t), sm = c => vs.filter(v => v.category === c).reduce((s, v) => s + (+v.value || 0), 0), tax = vs.reduce((s, v) => s + (+v.tax || 0), 0);\n      return [['🧾 زيارات اليوم', vs.length + S.data.operations.filter(o => o.date === t).length], ['🩺 الكشف', fmtN(st.kosf)], ['🧩 متنوع', fmtN(st.mixed)], ['🏥 العمليات', fmtN(st.opsRev)], ['💰 إجمالي الإيراد', fmtN(st.dayRev)], ['💵 النقدي', fmtN(vs.reduce((s, v) => s + cashOf(v), 0))], ['🏢 الشركات', fmtN(vs.reduce((s, v) => s + coAmt(v), 0))], ['🏛️ اللجنة', fmtN(vs.reduce((s, v) => s + comAmt(v), 0))], ['🛡️ التأمين', fmtN(vs.reduce((s, v) => s + discountAmt(v), 0))], ['🏛️ الضريبة', fmtN(tax)], ['💸 المصروفات', fmtN(st.expO)], ['📊 الصافي', fmtN(st.net)]];\n    } catch (e) { return []; }\n  };\n  const paint = () => { if (!bot) return; const h = stats().map(x => `\u003cspan class=\"dchip\">${x[0]}: \u003cb>${x[1]}\u003c/b>\u003c/span>`).join(''); const key = h; if (bot.dataset.k !== key) { bot.dataset.k = key; bot.firstChild.innerHTML = `\u003cdiv class=\"dtrack\">${h}${h}\u003c/div>`; } };\n  const mount = app => {\n    if (!top) {\n      top = document.createElement('div'); top.className = 'azkbar noprint';\n      mute = document.createElement('button'); mute.className = 'azkmute'; mute.type = 'button';\n      mute.onclick = () => { muted = !muted; ls.set('azk_mute', muted ? '1' : '0'); mute.textContent = muted ? '🔇' : '🔊'; mute.title = muted ? 'تشغيل الصوت' : 'إيقاف الصوت'; if (muted) stopAll(); else startAudio(); };\n      txt = document.createElement('span'); txt.className = 'azktxt'; const w = document.createElement('div'); w.className = 'azkwrap'; w.appendChild(txt);\n      top.append(mute, w);\n      bot = document.createElement('div'); bot.className = 'daybar noprint'; bot.innerHTML = '\u003cdiv class=\"dwrap\">\u003c/div>';\n      setInterval(() => { paint(); paintText(); if (!S.user) { stopAll(); started = false; playing = false; } }, 4000);\n    }\n    mute.textContent = muted ? '🔇' : '🔊'; mute.title = muted ? 'تشغيل الصوت' : 'إيقاف الصوت';\n    app.insertBefore(top, app.firstChild); app.appendChild(bot); bot.dataset.k = ''; paint();\n    paintText(); if (!started) { started = true; if (!muted) startAudio(); }\n  };\n  return {mount, paint, reload: async () => { await loadCustom(); if (playing && !muted) { cur = -1; advance(); } }};\n})();\nwindow.Bars = Bars;\n"}, {"k": "js", "c": "/* ============ إدارة البرنامج (للمدير فقط): الإعدادات، النسخ الاحتياطي، الاسترجاع، نسخة الماستر، حذف الكل ============ */\n'use strict';\nSCREEN_RENDER.admin = async function () {\n  if (!can('admin')) { $('#main').innerHTML = '\u003cdiv class=\"panel\">⛔ للمدير فقط\u003c/div>'; return; }\n  const main = $('#main'); let st = {}, master = {at: ''};\n  try { st = (await API.call('settings')).settings; master = await API.call('master_info'); } catch (e) {}\n  const fmtAt = a => a ? a.slice(0, 10).replace(/-/g, '/') + ' ' + a.slice(11, 16) + ' UTC' : 'لا توجد نسخة محفوظة';\n  main.innerHTML = `${pageHead('إدارة البرنامج', '⚙️', 'orange')}\n  \u003cdiv class=\"panel accent c-teal\">\u003ch3>⚙️ إعدادات البرنامج\u003c/h3>\u003cform id=\"stf\">\n    \u003cdiv class=\"fld\">\u003clabel>اسم البرنامج\u003c/label>\u003cinput name=\"appName\" value=\"${esc(st.appName)}\">\u003c/div>\n    \u003cdiv class=\"fld\">\u003clabel>اسم المركز\u003c/label>\u003cinput name=\"centerName\" value=\"${esc(st.centerName)}\">\u003c/div>\n    \u003cdiv class=\"fld\">\u003clabel>رقم الهاتف\u003c/label>\u003cinput name=\"phone\" value=\"${esc(st.phone)}\" dir=\"ltr\">\u003c/div>\n    \u003cdiv class=\"fld\">\u003clabel>اللوجو\u003c/label>\u003cdiv class=\"imgfld\">\u003cdiv class=\"th\" data-act=\"lightbox\" data-fid=\"${esc(st.logo)}\">🖼️\u003c/div>\u003cinput type=\"file\" accept=\"image/*\" class=\"hid\">\u003cbutton type=\"button\" class=\"btn sm c-blue\" data-act=\"pickimg\">📷 اختيار اللوجو\u003c/button>\u003cbutton type=\"button\" class=\"btn sm ghost\" id=\"nologo\">إزالة\u003c/button>\u003cinput type=\"hidden\" name=\"logo\" value=\"${esc(st.logo)}\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"fld\">\u003clabel>ملفات صوتية للأذكار (يمكن إرفاق أكثر من ملف — تعمل وراء بعض)\u003c/label>\u003cdiv class=\"audfld\">\u003cdiv id=\"azl\" class=\"muted\">\u003c/div>\u003cbutton type=\"button\" class=\"btn sm c-blue\" id=\"azp\">🎵 إضافة ملف صوتي\u003c/button>\u003cinput type=\"file\" id=\"azf\" accept=\"audio/*\" multiple class=\"hid\">\u003cinput type=\"hidden\" name=\"azkAudio\" value=\"${esc(st.azkAudio)}\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"actions\">\u003cbutton class=\"btn c-teal\" type=\"submit\">💾 حفظ الإعدادات\u003c/button>\u003c/div>\u003c/form>\u003c/div>\n  \u003cdiv class=\"panel accent c-gold\">\u003ch3>📥 استيراد البيانات وأوراق جوجل\u003c/h3>\n    \u003cp class=\"muted\">استيراد البيانات الأساسية (عيادات، أطباء، شركات، أشعة وتحاليل باختصاراتها) . المكرر يُتخطى. بعدها تظهر البيانات في أوراق جوجل بأسماء الشاشات وتتحدث تلقائياً مع كل إدخال.\u003c/p>\n    \u003cdiv class=\"actions\">\u003cbutton class=\"btn c-gold\" data-act=\"importseed\">📥 البيانات الأساسية\u003c/button>\u003cbutton class=\"btn c-teal\" data-act=\"syncsheets\">🔄 مزامنة أوراق جوجل\u003c/button>\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel accent c-blue\">\u003ch3>💾 النسخ الاحتياطي والاسترجاع\u003c/h3>\n    \u003cp class=\"muted\">النسخة تشمل كل بيانات البرنامج والمستخدمين والإعدادات (الصور لا تدخل في الملف).\u003c/p>\n    \u003cdiv class=\"actions\">\u003cbutton class=\"btn c-blue\" id=\"bk\">⬇️ تنزيل نسخة احتياطية\u003c/button>\u003cbutton class=\"btn c-orange\" id=\"rs\">⬆️ استرجاع من ملف\u003c/button>\u003cinput type=\"file\" id=\"rsf\" accept=\".json,application/json\" class=\"hid\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel accent c-violet\">\u003ch3>👑 النسخة الماستر\u003c/h3>\n    \u003cp class=\"muted\">نسخة كاملة محفوظة على الخادم تُحدَّث \u003cb>تلقائياً كل يوم\u003c/b> (عند فتح المدير للبرنامج) ويمكنك الرجوع إلى آخر نسخة بضغطة واحدة. آخر نسخة: \u003cb id=\"mat\">${fmtAt(master.at)}\u003c/b>\u003c/p>\n    \u003cdiv class=\"actions\">\u003cbutton class=\"btn c-violet\" id=\"ms\">📌 حفظ نسخة ماستر الآن\u003c/button>\u003cbutton class=\"btn c-orange\" id=\"mr\">↩️ استرجاع النسخة الماستر\u003c/button>\u003c/div>\u003c/div>\n  \u003cdiv class=\"panel accent c-red\">\u003ch3>🗑️ حذف كل البيانات\u003c/h3>\n    \u003cp class=\"muted\">يحذف الزيارات والمرضى والعمليات والمصروفات والعهد والسلف والتنفيذات، ويُبقي البيانات الأساسية (الأطباء والخدمات والعاملين وشركات التأمين) والمستخدمين وإعدادات البرنامج والنسخة الماستر. لا يمكن التراجع إلا بالاسترجاع.\u003c/p>\n    \u003cdiv class=\"fld\">\u003clabel>اكتب عبارة التأكيد: حذف الكل\u003c/label>\u003cinput id=\"rc\" autocomplete=\"off\">\u003c/div>\n    \u003cdiv class=\"actions\">\u003cbutton class=\"btn c-red\" id=\"rz\">🗑️ حذف الكل\u003c/button>\u003c/div>\u003c/div>`;\n  const reload = async () => { await loadAll(); await loadSettings(); render(); };\n  hydrateImgs(main);\n  $('#nologo').onclick = () => { const h = $('[name=logo]', main); h.value = ''; const th = $('.th', main); th.dataset.fid = ''; th.innerHTML = '🖼️'; };\n  const azIds = () => $('[name=azkAudio]').value.split(',').filter(Boolean), azNames = {};\n  const azDraw = () => { const ids = azIds(); $('#azl').innerHTML = ids.length ? ids.map((id, i) => `\u003cdiv>🎵 ${esc(azNames[id] || 'ملف صوتي ' + (i + 1))} \u003cbutton type=\"button\" class=\"btn sm ghost\" data-azx=\"${id}\">إزالة\u003c/button>\u003c/div>`).join('') + '\u003csmall>اضغط حفظ الإعدادات بعد التعديل\u003c/small>' : 'لا توجد ملفات مرفقة — يعمل الصوت الافتراضي (الملفان المضمّنان)'; $$('[data-azx]', $('#azl')).forEach(b => b.onclick = () => { $('[name=azkAudio]').value = azIds().filter(x => x !== b.dataset.azx).join(','); azDraw(); }); };\n  azDraw();\n  $('#azp').onclick = () => $('#azf').click();\n  $('#azf').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; if (!fs.length) return;\n    for (const f of fs) { if (azIds().length >= 10) { toast('الحد الأقصى 10 ملفات', true); break; }\n      if (f.size > 22e6) { toast(f.name + ': أكبر من 22 ميجا', true); continue; }\n      const mime = /^audio\\//.test(f.type) ? f.type : 'audio/mpeg';\n      await guard(null, async () => { toast('جاري رفع ' + f.name + '…');\n        const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });\n        const r = await API.call('upload', {mime, data}); azNames[r.file] = f.name; $('[name=azkAudio]').value = azIds().concat(r.file).join(','); azDraw(); toast('تم رفع ' + f.name); }); } };\n  $('#stf').onsubmit = e => { e.preventDefault(); guard($('button[type=submit]', e.target), async () => { const v = readForm(e.target); const r = await API.call('settings_save', v); applySettings(r.settings); toast('تم حفظ الإعدادات'); if (window.Bars) Bars.reload(); render(); }); };\n  $('#bk').onclick = e => guard(e.target, async () => {\n    const r = await API.call('backup'); const blob = new Blob([JSON.stringify(r.backup)], {type: 'application/json'});\n    saveBlob(blob, 'zahraa-backup-' + today().replace(/\\//g, '-') + '.json'); toast('تم تنزيل النسخة الاحتياطية');\n  });\n  $('#rs').onclick = () => $('#rsf').click();\n  $('#rsf').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return;\n    let bk; try { bk = JSON.parse(await f.text()); } catch (x) { return toast('الملف غير صالح', true); }\n    if (!await confirmBox('سيتم استبدال كل بيانات البرنامج الحالية بمحتوى هذه النسخة. هل أنت متأكد؟')) return;\n    await guard(null, async () => { await API.call('restore', {backup: bk}); toast('تم الاسترجاع — سجّل الدخول من جديد'); logoutLocal(); }); };\n  $('#ms').onclick = e => guard(e.target, async () => { const r = await API.call('master_save'); $('#mat').textContent = fmtAt(r.at); toast('تم حفظ النسخة الماستر'); });\n  $('#mr').onclick = async e => { if (!await confirmBox('سيتم استبدال كل البيانات الحالية بالنسخة الماستر. هل أنت متأكد؟')) return;\n    guard(e.target, async () => { await API.call('master_restore'); toast('تم استرجاع النسخة الماستر — سجّل الدخول من جديد'); logoutLocal(); }); };\n  $('#rz').onclick = async e => { if ($('#rc').value.trim() !== 'حذف الكل') return toast('اكتب عبارة التأكيد: حذف الكل', true);\n    if (!await confirmBox('تحذير: سيتم حذف جميع بيانات البرنامج نهائياً. هل أنت متأكد؟')) return;\n    guard(e.target, async () => { await API.call('reset', {confirm: 'حذف الكل'}); toast('تم حذف كل البيانات'); await reload(); }); };\n};\n\n/* ---------- متابعة المستخدمين (متصل / الصفحة الحالية) ---------- */\nconst fmtDT = iso => { const d = new Date(iso); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };\nasync function loadPres() { try { S.pres = {}; (await API.call('presence')).list.forEach(x => { S.pres[x.id] = x; }); } catch (e) {} }\nconst _usersScreen = SCREEN_RENDER.users;\nSCREEN_RENDER.users = async function (a) {\n  await loadPres(); const r = _usersScreen(a); clearInterval(window.__pt);\n  window.__pt = setInterval(async () => {\n    if (S.screen !== 'users' || !S.user) { clearInterval(window.__pt); return; }\n    if (document.querySelector('.modal') || document.hidden) return; const ae = document.activeElement; if (ae && ae.closest && ae.closest('form')) return;\n    await loadPres(); if (S.view && S.view.refresh) S.view.refresh();\n  }, 10000);\n  return r;\n};\n"}, {"k": "js", "c": "/* ============ قراءة بيانات الكارنيه / البطاقة من الصورة (OCR داخل المتصفح — الصورة لا تُرسل لأي خدمة خارجية) ============ */\n'use strict';\nconst OCR = (() => {\n  const AR_DIG = '٠١٢٣٤٥٦٧٨٩', FA_DIG = '۰۱۲۳۴۵۶۷۸۹';\n  const normDigits = s => String(s || '').replace(/[٠-٩]/g, c => AR_DIG.indexOf(c)).replace(/[۰-۹]/g, c => FA_DIG.indexOf(c));\n  const STOP = /جمهورية|مصر|العربية|بطاقة|تحقيق|شخصية|وزارة|الداخلية|تأمين|الرقم|القومي|كارنيه|كارنية|الصحي|هيئة|صالحة|حتى|تاريخ|الميلاد|محل|الإقامة|العنوان|المهنة|الحالة|الاجتماعية|الديانة|مسلم|مسيحي|اعزب|متزوج|ذكر|انثى|أنثى|شركة|رقم|بطاقه|المستفيد|الاسم/;\n  function birthFromNid(n) {\n    if (!/^[23]\\d{13}$/.test(n)) return '';\n    const y = (n[0] === '2' ? 1900 : 2000) + (+n.slice(1, 3)), m = +n.slice(3, 5), d = +n.slice(5, 7);\n    const dt = new Date(y, m - 1, d); if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return '';\n    return `${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`;\n  }\n  /* تحليل النص المستخرج → {nationalId, birthDate, cardNo, name} */\n  function parse(text) {\n    const t = normDigits(text), out = {nationalId: '', b
