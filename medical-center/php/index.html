<title>برنامج إدارة المركز الطبي</title>
<style>
/* برنامج إدارة المركز الطبي — واجهة إنفوجرافيك سينمائية على خلفية بيضاء، الخط Times New Roman أسود */
:root{
  --ink:#000;
  --line:#e7e9ef;
  --soft:#f6f7fb;
  --teal:#14c8b4;--teal2:#5ff5d6;
  --orange:#ff8a1f;--orange2:#ffc46b;
  --pink:#ff3d9a;--pink2:#ff9ac9;
  --violet:#8a5cff;--violet2:#c4a8ff;
  --blue:#2f9bff;--blue2:#8fd0ff;
  --gold:#ffc400;--gold2:#ffe27a;
  --red:#ff4d4d;--red2:#ff9a9a;
  --lime:#8fd91a;--lime2:#d4f56b;
  --cyan:#12c6e8;--cyan2:#7ff0ff;
}
*{box-sizing:border-box;font-family:"Times New Roman",Times,serif;color:#000}
html,body{margin:0;background:#fff;direction:rtl;font-size:17px;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:#000}
a{color:#000}
.hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.hidden{display:none!important}

/* ---------- ألوان الكروت ---------- */
.c-teal{--a:var(--teal2);--b:var(--teal);--g:rgba(20,200,180,.55)}
.c-orange{--a:var(--orange2);--b:var(--orange);--g:rgba(255,138,31,.55)}
.c-pink{--a:var(--pink2);--b:var(--pink);--g:rgba(255,61,154,.5)}
.c-violet{--a:var(--violet2);--b:var(--violet);--g:rgba(138,92,255,.5)}
.c-blue{--a:var(--blue2);--b:var(--blue);--g:rgba(47,155,255,.5)}
.c-gold{--a:var(--gold2);--b:var(--gold);--g:rgba(255,196,0,.55)}
.c-red{--a:var(--red2);--b:var(--red);--g:rgba(255,77,77,.5)}
.c-lime{--a:var(--lime2);--b:var(--lime);--g:rgba(143,217,26,.55)}
.c-cyan{--a:var(--cyan2);--b:var(--cyan);--g:rgba(18,198,232,.55)}

/* ---------- الكرت المضيء ---------- */
.glow{position:relative;overflow:hidden;border-radius:22px;cursor:pointer;border:0;
  background:linear-gradient(135deg,var(--a),var(--b));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),0 12px 28px -8px var(--g),0 0 26px -4px var(--g);
  animation:pulse 3.2s ease-in-out infinite alternate;
  transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s;
  -webkit-tap-highlight-color:transparent;text-align:center}
.glow::before{content:"";position:absolute;inset:-60% -30%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
.glow::after{content:"";position:absolute;width:140%;aspect-ratio:1;border-radius:50%;left:50%;top:50%;translate:-50% -50%;scale:0;background:rgba(255,255,255,.65);opacity:0;pointer-events:none}
.glow:hover{transform:translateY(-6px) scale(1.03);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8),0 18px 36px -8px var(--g),0 0 40px 0 var(--g)}
.glow:active,.glow.pop{transform:scale(.93)}
.glow.pop::after{animation:ripple .45s ease-out}
@keyframes pulse{from{filter:saturate(1)}to{filter:saturate(1.25) brightness(1.04)}}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes ripple{from{scale:0;opacity:.9}to{scale:1;opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{rotate:360deg}}

/* ---------- الهيكل ---------- */
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--teal),var(--blue),var(--violet),var(--pink),var(--orange),var(--gold)) 1}
.top .brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold;font-size:1.15rem}
.top .brand svg{width:42px;height:42px}
.top .grow{flex:1}
.top .who{font-size:.95rem;display:flex;align-items:center;gap:8px}
.top .who b{padding:2px 10px;border-radius:99px;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.main{padding:18px;max-width:1500px;margin:0 auto;animation:zoomIn .35s ease-out}
h1,h2,h3{margin:.2em 0}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.pagehead h1{font-size:1.6rem;display:flex;align-items:center;gap:10px}
.pagehead .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 18px -6px var(--g)}

/* ---------- أزرار ---------- */
.btn{border:0;border-radius:12px;padding:9px 18px;cursor:pointer;font-weight:bold;background:linear-gradient(135deg,var(--a,#e8ecf5),var(--b,#cfd6e6));box-shadow:0 6px 14px -6px var(--g,rgba(0,0,0,.3));transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.sm{padding:5px 11px;font-size:.88rem;border-radius:9px}
.btn.ghost{background:#fff;box-shadow:inset 0 0 0 2px var(--b,#cfd6e6)}

/* ---------- نماذج ---------- */
.panel{background:#fff;border-radius:20px;padding:16px;margin-bottom:16px;border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(40,40,80,.45)}
.panel>h3{margin:0 0 10px;display:flex;align-items:center;gap:8px}
.panel.accent{border-top:5px solid var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;position:relative}
.fld.full{grid-column:1/-1}
.fld label{font-weight:bold;font-size:.95rem}
.fld label i{color:var(--red);font-style:normal}
.fld input,.fld select,.fld textarea,.bar input,.bar select{border:2px solid #dfe3ee;border-radius:12px;padding:9px 12px;background:#fff;width:100%;outline:0;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus,.bar input:focus,.bar select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,155,255,.18)}
.fld input[readonly]{background:var(--soft);font-weight:bold}
.dt{display:flex;gap:6px}.dt button{border:0;border-radius:12px;padding:0 12px;cursor:pointer;background:linear-gradient(135deg,var(--blue2),var(--blue));font-size:1.1rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid #dfe3ee;background:#fff;border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:bold;transition:all .2s}
.seg button.on{border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 18px -8px var(--g);transform:scale(1.05)}
.imgfld{display:flex;align-items:center;gap:10px;border:2px dashed #cfd6e6;border-radius:12px;padding:8px}
.imgfld .th{width:64px;height:64px;border-radius:10px;background:var(--soft) center/cover;display:grid;place-items:center;overflow:hidden;cursor:zoom-in;font-size:1.6rem}
.imgfld .th img{width:100%;height:100%;object-fit:cover}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sub{margin-top:12px;padding:12px;border-radius:16px;background:linear-gradient(135deg,rgba(255,196,0,.14),rgba(255,138,31,.12));border:2px solid rgba(255,138,31,.4);animation:zoomIn .3s}
.sub h4{margin:0 0 8px}
.ro-big{font-size:1.25rem;font-weight:bold}

/* ---------- الاقتراحات ---------- */
.sgbox{position:absolute;z-index:80;background:#fff;border-radius:12px;border:2px solid var(--blue);box-shadow:0 14px 30px -10px rgba(0,0,0,.35);max-height:240px;overflow:auto;min-width:200px}
.sgbox div{padding:8px 12px;cursor:pointer}
.sgbox div:hover,.sgbox div.on{background:linear-gradient(90deg,var(--blue2),var(--cyan2))}

/* ---------- الجداول ---------- */
.tools,.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar .seg button{padding:6px 14px}
.bar input[type=text],.bar select{width:auto;min-width:150px}
.tbl-wrap{overflow:auto;border-radius:16px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{position:sticky;top:0;background:linear-gradient(135deg,var(--teal2),var(--blue2));padding:9px 10px;white-space:nowrap;text-align:right}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#fafbff}
tbody tr:hover{background:#fff7e0}
tfoot td{font-weight:bold;background:linear-gradient(135deg,var(--gold2),var(--orange2));border-top:2px solid var(--orange)}
.lnk{cursor:pointer;font-weight:bold;border-bottom:2px dotted var(--violet);padding-bottom:1px}
.lnk:hover{background:var(--violet2)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:bold;background:linear-gradient(135deg,var(--a,#eee),var(--b,#ddd))}
.empty{padding:30px;text-align:center;opacity:.7}
.mini-img{width:34px;height:34px;border-radius:8px;object-fit:cover;cursor:zoom-in;vertical-align:middle}

/* ---------- لوحة البداية ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 10px;cursor:pointer}
.kpi small{display:block;font-weight:bold}
.kpi strong{display:block;font-size:1.9rem;margin-top:4px}
.sect{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.sect h2{font-size:1.3rem}
.sect::after{content:"";flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--violet),var(--pink),transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tile{padding:20px 10px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile .ic{font-size:2.3rem;animation:floaty 3.4s ease-in-out infinite}
.tile b{font-size:1.12rem}
.tile .n{font-size:1.5rem;font-weight:bold}
.tile.clinic{align-items:stretch;text-align:right;padding:14px 16px;min-height:118px}
.tile.clinic .row{display:flex;justify-content:space-between;align-items:baseline}
.tile.clinic .meter{height:8px;border-radius:8px;background:rgba(255,255,255,.55);overflow:hidden}
.tile.clinic .meter i{display:block;height:100%;background:#000;opacity:.75;border-radius:8px;transition:width .8s}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:.9rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:5px;vertical-align:middle}
.barrow{display:grid;grid-template-columns:130px 1fr 80px;gap:8px;align-items:center;margin:6px 0}
.barrow .tr{height:16px;border-radius:10px;background:var(--soft);overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 12px var(--g);transition:width .8s}

/* ---------- تسجيل الدخول ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;
  background:radial-gradient(circle at 15% 10%,rgba(20,200,180,.16),transparent 40%),radial-gradient(circle at 90% 20%,rgba(255,61,154,.14),transparent 40%),radial-gradient(circle at 50% 100%,rgba(255,196,0,.18),transparent 45%),#fff}
.login .box{width:min(430px,100%);text-align:center;animation:zoomIn .5s}
.login .logo svg{width:110px;height:110px;animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(255,61,154,.35))}
.login h1{font-size:1.7rem;margin:6px 0 12px}
.clockbox{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 16px;flex-wrap:wrap}
.clockbox svg{width:150px;height:150px;filter:drop-shadow(0 8px 14px rgba(47,155,255,.35))}
.digital{font-size:2.2rem;font-weight:bold;letter-spacing:2px;direction:ltr}
.dateline{font-size:1.1rem;font-weight:bold}
.login form{display:grid;gap:10px;text-align:right}
.login .glow.btnbig{padding:12px;font-size:1.1rem;font-weight:bold;border-radius:16px}
.linkbtn{background:none;border:0;cursor:pointer;font-weight:bold;text-decoration:underline;margin-top:10px}

/* ---------- نوافذ ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(20,20,40,.45);display:grid;place-items:center;padding:16px;animation:zoomIn .2s}
.modal .m{max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;max-width:min(560px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border-top:6px solid var(--violet)}
.modal .m img{max-width:100%;max-height:80vh;border-radius:12px;display:block}
.toast{position:fixed;bottom:20px;left:50%;translate:-50% 0;z-index:200;padding:12px 22px;border-radius:14px;font-weight:bold;background:linear-gradient(135deg,var(--lime2),var(--lime));box-shadow:0 14px 30px -10px rgba(0,0,0,.4);animation:zoomIn .25s}
.toast.err{background:linear-gradient(135deg,var(--red2),var(--red))}
.spinner{width:42px;height:42px;border-radius:50%;border:5px solid var(--violet2);border-top-color:var(--pink);animation:spin .8s linear infinite;margin:40px auto}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.perm-grid label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--soft);cursor:pointer}
.perm-grid input{width:auto}

@media(max-width:700px){html,body{font-size:16px}.main{padding:12px}.top .who span{display:none}.barrow{grid-template-columns:90px 1fr 64px}}
@media print{@page{size:A4 landscape;margin:10mm}.pagehead,#frm,form,.btn,.seg,input,select,textarea,.linkbtn,.cards,.tabs,.hint,.modal,.backdrop{display:none!important}.kpis{display:grid!important}html,body{font-size:11px}table{font-size:10px}td,th{white-space:normal}.printhead{display:block!important;text-align:center;margin-bottom:8px;border-bottom:3px solid #000}.sgbox{display:none}.top,.tools,.bar,.actions,.noprint,.toast{display:none!important}.main{padding:0;animation:none}.panel{box-shadow:none;break-inside:avoid}.glow{animation:none;box-shadow:none;border:1px solid #999}.glow::before{display:none}.tbl-wrap{overflow:visible}th{position:static}}
@media screen{.printhead{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.newuser{position:fixed;top:14px;inset-inline-start:14px;width:42px;height:42px;border-radius:50%;border:2px solid #ff3d9a;background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 0 12px rgba(255,61,154,.5);z-index:5}
.newuser sup{font-size:.8rem;color:#ff3d9a;font-weight:bold}
.hidden{display:none!important}

/* ---------- تصغير الشاشات والكروت ---------- */
html,body{font-size:14px}
.top{padding:6px 12px;gap:8px}.top .brand{font-size:1rem}.top .brand svg{width:32px;height:32px}.top .who{font-size:.85rem}
.main{padding:10px}
.pagehead{margin-bottom:8px;gap:8px}.pagehead h1{font-size:1.2rem;margin:0;gap:8px}.pagehead .ico{width:34px;height:34px;border-radius:10px;font-size:1.1rem}
.glow{border-radius:14px}
.btn{padding:6px 12px;border-radius:9px;font-size:.9rem}.btn.sm{padding:3px 8px;font-size:.8rem;border-radius:7px}
.panel{padding:10px;border-radius:14px;margin-bottom:10px}.panel>h3{margin:0 0 6px;font-size:1rem}
.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.fld label{font-size:.85rem}.fld input,.fld select,.fld textarea,.bar input,.bar select{padding:5px 8px;border-radius:8px;border-width:1.5px}
table{font-size:.85rem}th{padding:5px 7px}td{padding:4px 7px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.kpi{padding:8px 6px}.kpi small{font-size:.78rem}.kpi strong{font-size:1.2rem;margin-top:2px}
.sect{margin:12px 0 6px}.sect h2{font-size:1.05rem;margin:0}.sect::after{height:3px}
.cards{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{padding:8px 6px;min-height:76px;gap:3px}.tile .ic{font-size:1.5rem}.tile b{font-size:.88rem}.tile .n{font-size:1.05rem}
.tile.clinic{padding:8px 10px;min-height:72px}.tile.clinic .meter{height:5px}
.charts{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.login .box{width:min(380px,100%)}.login .logo svg{width:84px;height:84px}.login h1{font-size:1.35rem}
.modal .box,.modal>div{max-width:min(560px,96vw)}
.daytot td{background:#f3f3f3;font-weight:bold}

</style>

<script>
/* طبقة الاتصال: php | gas | local (تجريبي داخل المتصفح)
   نفس الأوامر تعمل في الثلاثة: status, register, login, me, logout, list, save, delete, upload, file */
(function(){
'use strict';
const MODE = window.API_MODE || 'php';
let token = null;
try { token = sessionStorage.getItem('mc_token'); } catch(e){}

async function call(action, payload){
  const body = Object.assign({action, token}, payload||{});
  let res;
  if (MODE === 'gas') {
    const txt = await new Promise((ok, fail) => {
      google.script.run.withSuccessHandler(ok).withFailureHandler(e => fail(new Error((e && e.message) || String(e)))).handle(JSON.stringify(body));
    });
    res = JSON.parse(txt);
  } else if (MODE === 'local') {
    res = await Local.handle(JSON.parse(JSON.stringify(body)));
  } else {
    const url = server();
    const gasRemote = /^https:\/\/script\.google(usercontent)?\.com\//.test(url);
    const r = await fetch(url, {method:'POST', redirect:'follow', headers:{'Content-Type': gasRemote ? 'text/plain;charset=utf-8' : 'application/json'}, body: JSON.stringify(body)});
    const t = await r.text();
    try { res = JSON.parse(t); } catch(e){ throw new Error('استجابة غير صالحة من الخادم'); }
  }
  if (res.error) { const e = new Error(res.error); e.code = res.code; throw e; }
  return res;
}
function server(){ let u = ''; try { u = localStorage.getItem('mc_server') || ''; } catch(e){} return u || window.API_URL || 'api.php'; }
function setServer(u){ try { u ? localStorage.setItem('mc_server', u) : localStorage.removeItem('mc_server'); } catch(e){} setToken(null); }
function setToken(t){ token = t; try { t ? sessionStorage.setItem('mc_token', t) : sessionStorage.removeItem('mc_token'); } catch(e){} }
window.API = {call, setToken, setServer, server, getToken: () => token, mode: MODE};

/* ====================== خادم تجريبي داخل المتصفح ====================== */
const ENT = ['users','staff','doctors','services','operations','patients','companies','visits','expenses','custody'];
const LOOKUP = ['doctors','services','patients','companies'];
const WRITE = {staff:['staff'],doctors:['doctors'],services:['services'],operations:['operations'],patients:['patients','visits'],companies:['companies'],visits:['visits'],expenses:['expenses','dues'],custody:['custody']};
const FIELDS = {
  users:'username,nationalId,birthDate,perms,isAdmin,active',
  staff:'code,name,nationalId,idPhoto,photo',
  doctors:'code,name,clinic,phone,nationalId,idPhoto,syndicatePhoto,photo,hireDate,percent,fixed,opPercent',
  services:'type,name,price,tax',
  operations:'date,patient,operation,clinic,doctor,doctorId,value,doctorPercent,notes,anesthetist,anesthetistId,anesthesia,deductAnes',
  patients:'name,phone',
  companies:'name,fee,contact',
  visits:'serial,date,patient,phone,clinic,doctor,doctorId,visitType,service,value,tax,category,company,formNo,formPhoto,cardNo,cardPhoto,nationalId,patientPct,discount,notes',
  expenses:'date,category,amount,notes,doctor,dueDate,docNo',
  custody:'date,person,kind,dir,amount,notes,docNo'
};
const NUMS = new Set('percent,fixed,opPercent,price,tax,value,doctorPercent,fee,patientPct,discount,amount,code,serial,anesthesia'.split(','));
const DATES = new Set(['date','hireDate','birthDate','dueDate']);
const AUTO = {staff:'code', doctors:'code', visits:'serial'};

const mem = {};
const store = {
  get(k){ try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch(e){ if (mem[k]) return JSON.parse(mem[k]); } return null; },
  set(k, v){ const s = JSON.stringify(v); try { localStorage.setItem(k, s); } catch(e){ mem[k] = s; } }
};
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b.toString(16).padStart(2,'0')).join('');
async function sha(s){
  if (crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2,'0')).join(''); }
  let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return String(h);
}
const validDate = s => { if (!/^\d{4}\/\d{2}\/\d{2}$/.test(s)) return false; const [y,m,d] = s.split('/').map(Number); const t = new Date(y, m-1, d); return t.getFullYear()===y && t.getMonth()===m-1 && t.getDate()===d; };
const has = (u, p) => u.isAdmin || (u.perms || []).includes(p);

const Local = {
  db(){ return store.get('mc_db') || {rec:{}, files:{}, tokens:{}, fails:{}}; },
  save(db){ store.set('mc_db', db); },
  async handle(b){
    const db = this.db();
    const fail = (error, code) => ({error, code});
    const A = b.action;
    if (A === 'status') return {hasUsers: (db.rec.users || []).length > 0};
    if (A === 'register') {
      const users = db.rec.users || (db.rec.users = []);
      const u = String(b.username || '').trim(), p = String(b.password || '');
      if (u.length < 3 || p.length < 4) return fail('اسم المستخدم 3 أحرف على الأقل وكلمة السر 4 أحرف على الأقل');
      if (users.some(x => x.username.toLowerCase() === u.toLowerCase())) return fail('اسم المستخدم موجود بالفعل');
      const first = users.length === 0, salt = rid();
      const rec = {id: rid(), username: u, salt, hash: await sha(salt + p), nationalId: String(b.nationalId || '').slice(0, 20), birthDate: validDate(b.birthDate) ? b.birthDate : '', perms: first ? ['*'] : [], isAdmin: first, active: first, createdAt: new Date().toISOString()};
      users.push(rec);
      if (first && window.SEED) this.seed(db);
      this.save(db);
      return {ok: true, pending: !first};
    }
    if (A === 'login') {
      const users = db.rec.users || [], u = String(b.username || '').trim().toLowerCase();
      const f = db.fails[u] || {n: 0, t: 0};
      if (f.n >= 5 && Date.now() - f.t < 600000) return fail('محاولات كثيرة، حاول بعد 10 دقائق');
      const rec = users.find(x => x.username.toLowerCase() === u);
      if (!rec || rec.hash !== await sha(rec.salt + String(b.password || ''))) { db.fails[u] = {n: f.n + 1, t: Date.now()}; this.save(db); return fail('اسم المستخدم أو كلمة السر غير صحيحة'); }
      if (!rec.active) return fail('حسابك بانتظار موافقة المدير', 'pending');
      delete db.fails[u];
      const t = rid() + rid(); db.tokens[t] = {id: rec.id, exp: Date.now() + 12 * 3600e3}; this.save(db);
      return {token: t, user: this.pub(rec)};
    }
    const tk = db.tokens[b.token];
    const me = tk && tk.exp > Date.now() && (db.rec.users || []).find(x => x.id === tk.id && x.active);
    if (!me) return fail('انتهت الجلسة، سجل الدخول من جديد', 'auth');
    if (A === 'me') return {user: this.pub(me)};
    if (A === 'logout') { delete db.tokens[b.token]; this.save(db); return {ok: true}; }
    const e = b.entity;
    if (['list','save','delete'].includes(A) && !ENT.includes(e)) return fail('كيان غير معروف');
    if (A === 'list') {
      const readable = me.isAdmin || (e !== 'users' && (e === 'staff' ? has(me, 'staff') : (LOOKUP.includes(e) || has(me, e) || has(me, 'dashboard') || has(me, 'dues') || me.perms.some(p => p.startsWith('rep_')))));
      if (!readable) return fail('غير مصرح', 'forbidden');
      let items = (db.rec[e] || []).slice();
      if (b.from) items = items.filter(r => !r.date || r.date >= b.from);
      if (b.to) items = items.filter(r => !r.date || r.date <= b.to);
      return {items: items.map(r => e === 'users' ? this.pub(r) : r)};
    }
    if (A === 'save' || A === 'delete') {
      const ok = me.isAdmin || (e !== 'users' && (WRITE[e] || []).some(p => has(me, p)));
      if (!ok) return fail('غير مصرح', 'forbidden');
      const list = db.rec[e] || (db.rec[e] = []);
      if (A === 'delete') {
        const r = list.find(x => x.id === b.id); if (!r) return fail('غير موجود');
        if (e === 'users' && (r.id === me.id || (r.isAdmin && list.filter(x => x.isAdmin && x.active).length < 2))) return fail('لا يمكن حذف هذا المستخدم');
        db.rec[e] = list.filter(x => x.id !== b.id); this.save(db); return {ok: true};
      }
      const src = b.record || {}, out = {};
      for (const k of FIELDS[e].split(',')) {
        if (!(k in src)) continue; let v = src[k];
        if (k === 'perms') v = Array.isArray(v) ? v.map(String).slice(0, 60) : [];
        else if (k === 'isAdmin' || k === 'active') v = !!v;
        else if (NUMS.has(k)) v = Number(v) || 0;
        else { v = String(v == null ? '' : v).trim().slice(0, 500); if (DATES.has(k) && v && !validDate(v)) return fail('صيغة التاريخ يجب أن تكون yyyy/mm/dd'); }
        out[k] = v;
      }
      let rec = src.id && list.find(x => x.id === src.id);
      if (e === 'users') {
        const nm = String(out.username || '').trim();
        if (nm.length < 3) return fail('اسم المستخدم قصير');
        if (list.some(x => x.id !== src.id && x.username.toLowerCase() === nm.toLowerCase())) return fail('اسم المستخدم موجود بالفعل');

        if (src.password) { out.salt = rid(); out.hash = await sha(out.salt + src.password); }
      } else {
        if (!String(out.name || out.date || out.category || out.type || '').trim()) return fail('بيانات ناقصة');
        if (e !== 'users' && AUTO[e] && !rec) out[AUTO[e]] = list.reduce((m, x) => Math.max(m, x[AUTO[e]] || 0), 0) + 1;
        if (rec && AUTO[e]) out[AUTO[e]] = rec[AUTO[e]];
      }

      this.save(db);

<script>
/* ============ شاشات الإدخال: محرك عام + الزيارات + المستخدمين ============ */
'use strict';
window.SCREEN_RENDER = window.SCREEN_RENDER || {};
const stripTags = h => String(h).replace(/<[^>]+>/g, ' ');

function crud(cfg) {
  (window.CRUDS = window.CRUDS || {})[cfg.ent] = cfg;
  return async function () {
    if (!can(cfg.k)) { $('#main').innerHTML = '<div class="panel">⛔ لا تملك صلاحية فتح هذه الشاشة</div>'; return; }
    const main = $('#main'); let editing = null, q = '';
    const fields = cfg.fields, plain = fields.filter(f => !f.grp), grps = cfg.groups || {};
    const defaults = () => Object.assign({}, cfg.defaults ? cfg.defaults() : {});
    const frmHTML = () => `<form id="frm" class="panel accent c-${cfg.c}" autocomplete="off"><h3 id="ftitle">➕ ${esc(cfg.add || 'إضافة جديد')}</h3><div class="grid">${plain.map(f => f.t === 'html' ? f.html() : fieldHTML(f, '')).join('')}</div>${Object.keys(grps).map(g => `<div class="sub hidden" data-grp="${g}"><h4>${esc(grps[g].title)}</h4><div class="grid">${fields.filter(f => f.grp === g).map(f => fieldHTML(f, '')).join('')}</div></div>`).join('')}<div class="actions"><button type="submit" class="btn c-${cfg.c}">💾 حفظ</button><button type="button" class="btn ghost c-${cfg.c}" data-act="frmnew">➕ جديد</button></div></form>`;
    const rows = () => {
      let list = S.data[cfg.ent].slice();
      if (cfg.dated) { const {from, to} = getRange(); list = list.filter(r => r.date >= from && r.date <= to); }
      if (q) list = list.filter(r => JSON.stringify(r).toLowerCase().includes(q));
      return (cfg.sort ? list.sort(cfg.sort) : list.reverse());
    };
    const listHTML = () => {
      const list = rows(); const cols = cfg.cols;
      const body = list.map(r => `<tr>${cols.map(c => `<td>${c.f(r)}</td>`).join('')}<td><button class="btn sm c-teal" data-act="prow" data-e="${cfg.ent}" data-id="${r.id}" title="طباعة البند">🖨️</button> <button class="btn sm c-blue" data-act="edit" data-id="${r.id}">✏️</button> <button class="btn sm c-red" data-act="del" data-id="${r.id}">🗑️</button></td></tr>`).join('');
      const foot = cols.some(c => c.sum) ? `<tfoot><tr>${cols.map((c, i) => `<td>${c.sum ? fmtN(list.reduce((s, r) => s + (+c.sum(r) || 0), 0)) : (i === 0 ? `الإجمالي (${list.length})` : '')}</td>`).join('')}<td></td></tr></tfoot>` : '';
      return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th>${c.h}</th>`).join('')}<th></th></tr></thead><tbody>${body || `<tr><td colspan="${cols.length + 1}" class="empty">لا توجد بيانات${cfg.dated ? ' في هذه الفترة' : ''}</td></tr>`}</tbody>${foot}</table></div>`;
    };
    const frm = () => $('#frm', main);
    const reset = () => {
      editing = null; const f = frm(); f.reset(); $('#ftitle', f).textContent = `➕ ${cfg.add || 'إضافة جديد'}`;
      const vals = defaults(); fields.forEach(x => { if (!(x.k in vals) && x.t !== 'html') vals[x.k] = (x.t === 'seg' ? x.opts[0].v : (x.t === 'chk' ? false : '')); });
      setForm(f, vals); showGroups(); cfg.onChange && cfg.onChange('*', f, {editing, reset: true});
    };
    const showGroups = () => { const v = readForm(frm()); Object.keys(grps).forEach(g => $(`[data-grp="${g}"]`, frm()).classList.toggle('hidden', !grps[g].show(v))); };
    const draw = () => {
      main.innerHTML = `${pageHead(cfg.t, cfg.i, cfg.c)}${cfg.dated ? rangeBar() : ''}${frmHTML()}<div class="bar noprint"><input type="text" id="srch" placeholder="🔎 بحث…" value="${esc(q)}">${window.exportButtons}${cfg.tools ? cfg.tools() : ''}</div><div id="lst">${listHTML()}</div>`;
      reset(); hydrateImgs(main);
      $('#srch').oninput = e => { q = e.target.value.trim().toLowerCase(); $('#lst').innerHTML = listHTML(); hydrateImgs($('#lst')); };
      frm().addEventListener('change', ev => { showGroups(); cfg.onChange && cfg.onChange(ev.target.name, frm(), {editing}); });
      frm().addEventListener('input', ev => { if (ev.target.matches('[data-sg],input[type=number],[data-dt]')) cfg.onChange && cfg.onChange(ev.target.name, frm(), {editing, typing: true}); });
      frm().onsubmit = ev => { ev.preventDefault(); guard($('button[type=submit]', frm()), async () => {
        const raw = readForm(frm()); let rec = cfg.collect ? cfg.collect(raw) : Object.fromEntries(Object.entries(raw).filter(([k]) => !k.startsWith('_')));
        for (const f of fields) if (f.req && !String(rec[f.k] == null ? raw[f.k] : rec[f.k]).trim()) throw new Error(`حقل "${f.l}" مطلوب`);
        for (const f of fields) if (f.t === 'date' && rec[f.k] && !validDate(rec[f.k])) throw new Error(`"${f.l}": الصيغة yyyy/mm/dd`);
        if (cfg.validate) { const m = cfg.validate(rec, editing); if (m) throw new Error(m); }
        if (editing) rec.id = editing;
        const r = await API.call('save', {entity: cfg.ent, record: rec});
        if (cfg.after) await cfg.after(r.record, rec);
        await loadAll([cfg.ent]); toast('تم الحفظ ✔'); $('#lst').innerHTML = listHTML(); hydrateImgs($('#lst')); reset();
      }); };
    };
    S.view = {refresh: draw,
      edit: id => { const r = S.data[cfg.ent].find(x => x.id === id); if (!r) return; editing = id; const f = frm(); $('#ftitle', f).textContent = '✏️ تعديل'; setForm(f, cfg.fill ? cfg.fill(r) : r); showGroups(); cfg.onChange && cfg.onChange('*', f, {editing, loaded: true}); f.scrollIntoView({behavior: 'smooth', block: 'start'}); },
      del: async id => { if (!await confirmBox('هل تريد حذف هذا السجل نهائياً؟')) return; await guard(null, async () => { await API.call('delete', {entity: cfg.ent, id}); await loadAll([cfg.ent]); toast('تم الحذف'); $('#lst').innerHTML = listHTML(); if (editing === id) reset(); }); },
      reset};
    draw();
  };
}

});

  fields: [{k: 'type', l: 'النوع', t: 'seg', opts: Object.keys(SVTYPE).map(v => ({v, l: SVTYPE[v], c: SVCOLOR[v]}))}, {k: 'name', l: 'اسم الخدمة', req: 1, sg: 'services.name'}, {k: 'price', l: 'القيمة', t: 'num', req: 1}, {k: 'tax', l: 'الضريبة (لكل زيارة)', t: 'num'}],

    const jobs = [];
    (SD.services || []).forEach(x => { if (!S.data.services.some(s => s.type === x.type && s.name === x.name)) jobs.push(['services', x]); });

    if (can('companies')) (SD.companies || []).forEach(x => { if (!S.data.companies.some(c => c.name === x.name)) jobs.push(['companies', x]); });

/* ---------- العيادات: الإيرادات (سطر لكل عيادة/طبيب) ثم المصروفات مقابل الإيرادات ---------- */
function clinicsOverview(from, to, all) {
  const ops = opsIn(from, to), g = new Map();
  const slot = c => { c = c || '—'; if (!g.has(c)) g.set(c, {c, vs: [], ops: []}); return g.get(c); };
  all.forEach(v => slot(v.clinic).vs.push(v));
  ops.forEach(o => slot(o.clinic).ops.push(o));
  const rows = [...g.values()].map(x => {
    const kosf = sum(x.vs.filter(v => v.visitType !== 'متنوع'), val), mixed = sum(x.vs.filter(v => v.visitType === 'متنوع'), val) + sum(x.ops, o => o.value), total = kosf + mixed;
    const co = sum(x.vs.filter(v => v.category === 'company'), val), ins = sum(x.vs, discountAmt), com = sum(x.vs.filter(v => v.category === 'committee'), val), tax = sum(x.vs, v => v.tax);
    return Object.assign(x, {kosf, mixed, total, co, ins, com, tax, net: total - co - ins - com});
  }).sort((a, b) => a.c.localeCompare(b.c, 'ar'));
  const T = k => sum(rows, r => r[k]);
  const revTbl = tbl(['العيادة', 'كشف', 'متنوع', 'الإجمالي', 'شركات', 'تأمين', 'لجنة', 'ضرائب'],
    rows.map(r => [L.clinic(r.c), fmtN(r.kosf), fmtN(r.mixed), fmtN(r.total), fmtN(r.co), fmtN(r.ins), fmtN(r.com), fmtN(r.tax)]),
    ['الإجمالي', fmtN(T('kosf')), fmtN(T('mixed')), fmtN(T('total')), fmtN(T('co')), fmtN(T('ins')), fmtN(T('com')), fmtN(T('tax'))]);
  const paid = S.data.expenses.filter(e => e.doctor && payDay(e) >= from && payDay(e) <= to), other = S.data.expenses.filter(e => !e.doctor && e.date >= from && e.date <= to);
  const pg = new Map(); paid.forEach(e => { const k = e.doctor + '\u0001' + (e.category || 'مستحقات أطباء'); (pg.get(k) || pg.set(k, []).get(k)).push(e); });
  const exRows = [
    ...[...pg.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ar')).map(([k, a]) => [L.doctor(k.split('\u0001')[0]), fmtN(sum(a, e => e.amount)), esc([k.split('\u0001')[1], ...new Set(a.map(e => e.notes).filter(Boolean))].join(' — '))]),
    ...other.slice().sort((a, b) => a.date.localeCompare(b.date)).map(e => [esc(e.notes || e.category || ''), fmtN(e.amount), esc(e.category || '')])];
  const exT = sum(paid, e => e.amount) + sum(other, e => e.amount), net = T('net') - exT;
  const netDay = net, noteRow = t => `<b>${t}</b>`;
  const stmt = tbl(['البيان', 'القيمة', 'ملاحظات'], [[noteRow('إجمالي الإيرادات (القيمة)'), noteRow(fmtN(T('net'))), 'بعد الشركات والتأمين واللجنة'], ...exRows, [noteRow('إجمالي المصروفات'), noteRow(fmtN(exT)), ''], [noteRow('صافي اليوم'), noteRow(fmtN(netDay)), 'الإيرادات − المصروفات'], [noteRow('الضريبة'), noteRow(fmtN(T('tax'))), 'غير مخصومة من الصافي']]);
  return kpiRow([['الإيرادات (القيمة)', fmtN(T('net')), 'orange'], ['المصروفات', fmtN(exT), 'red'], ['صافي اليوم', fmtN(net), net >= 0 ? 'lime' : 'pink']])
    + sect('الإيرادات') + revTbl
    + sect('المصروفات مقابل الإيرادات') + stmt
}
/* العيادات والأطباء بالتفصيل + مستحقات الأطباء (تُستخدم في تقرير الإجماليات) */
function detailSections(from, to) {
  const all = visitsIn(from, to), ops = opsIn(from, to);
  const g = new Map(), dayDue = new Map();
  const slot = (c, d, kind) => { const k = kind + '\u0001' + c + '\u0001' + d; if (!g.has(k)) g.set(k, {kind, c, d, vs: [], ops: [], due: 0}); return g.get(k); };
  all.forEach(v => slot(v.clinic || '—', v.doctor || '—', 'v').vs.push(v));
  [...g.values()].forEach(x => { const doc = x.vs[0] && findDoctor(x.vs[0]), pct = doc ? +doc.percent || 0 : 0; groupBy(x.vs, v => v.date).forEach((a, day) => { const due = (sum(a, val) - sum(a, v => v.tax)) * pct / 100; x.due += due; const k = (doc ? doc.id : '?' + x.d) + '|' + day; const e = dayDue.get(k) || {sum: 0, first: x, fx: doc ? +doc.fixed || 0 : 0}; e.sum += due; dayDue.set(k, e); }); });
  dayDue.forEach(e => { const top = Math.max(0, e.fx - e.sum); if (top > 0) e.first.due += top; });
  ops.forEach(o => { const oc = opCalc(o), x = slot('عمليات', o.doctor || '—', 'o'); x.ops.push(o); x.due += oc.surgeon; if (oc.anes > 0 && (o.anesthetist || o.anesthetistId)) { const an = slot('تخدير العمليات', o.anesthetist || '—', 'a'); an.ops.push(o); an.due += oc.anes; } });
  const order = {v: 0, o: 1, a: 2};
  const rows = [...g.values()].sort((a, b) => order[a.kind] - order[b.kind] || a.c.localeCompare(b.c, 'ar') || a.d.localeCompare(b.d, 'ar')).map(x => {
    if (x.kind === 'v') { const kosf = sum(x.vs.filter(v => v.visitType !== 'متنوع'), val), mixed = sum(x.vs.filter(v => v.visitType === 'متنوع'), val); return Object.assign(x, {kosf, mixed, rev: kosf + mixed, co: sum(x.vs.filter(v => v.category === 'company'), val), ins: sum(x.vs, discountAmt), com: sum(x.vs.filter(v => v.category === 'committee'), val), tax: sum(x.vs, v => v.tax)}); }
    if (x.kind === 'o') { const t = sum(x.ops, o => o.value); return Object.assign(x, {kosf: 0, mixed: t, rev: t, co: 0, ins: 0, com: 0, tax: 0}); }
    return Object.assign(x, {kosf: 0, mixed: 0, rev: 0, co: 0, ins: 0, com: 0, tax: 0});
  });
  // المدفوع لكل طبيب (حسب يوم الاستحقاق) يوزَّع على سطوره بالترتيب
  const paidBy = new Map(); S.data.expenses.filter(e => e.doctor && payDay(e) >= from && payDay(e) <= to).forEach(e => paidBy.set(e.doctor, (paidBy.get(e.doctor) || 0) + (+e.amount || 0)));
  const left = new Map(paidBy), lastRow = new Map(); rows.forEach(r => lastRow.set(r.d, r));
  rows.forEach(r => { const rest = left.get(r.d) || 0; const pd = lastRow.get(r.d) === r ? rest : Math.min(r.due, rest); r.paid = pd; left.set(r.d, rest - pd); r.rest = r.due - r.paid; });
  paidBy.forEach((v, name) => { if (!rows.some(r => r.d === name)) rows.push({kind: 'p', c: '—', d: name, kosf: 0, mixed: 0, rev: 0, co: 0, ins: 0, com: 0, tax: 0, due: 0, paid: v, rest: -v}); });
  const T = k => sum(rows, r => r[k]), st = statementRows(from, to), b = t => `<b>${t}</b>`;
  const cl = r => r.kind === 'v' ? L.clinic(r.c) : esc(r.c), dn = r => r.d === '—' ? '—' : L.doctor(r.d);
  const detail = tbl(['العيادة', 'اسم الطبيب', 'كشف', 'متنوع', 'إيرادات', 'شركات', 'لجنة', 'تأمين', 'ضرائب'],
    [...rows.filter(r => r.kind !== 'p').map(r => [cl(r), dn(r), fmtN(r.kosf), fmtN(r.mixed), fmtN(r.rev), fmtN(r.co), fmtN(r.com), fmtN(r.ins), fmtN(r.tax)]),
     [b('الإجمالي'), '', b(fmtN(T('kosf'))), b(fmtN(T('mixed'))), b(fmtN(T('rev'))), b(fmtN(T('co'))), b(fmtN(T('com'))), b(fmtN(T('ins'))), b(fmtN(T('tax')))],
     [b('صافي اليوم'), '', '', '', b(fmtN(st.net)), '', '', '', ''],
     [b('الضريبة'), '', '', '', '', '', '', '', b(fmtN(T('tax')))]]);
  const tag = r => r.due <= 0 && r.paid <= 0 ? '' : r.rest <= 0.005 ? '<span class="tag c-lime">تم الصرف</span>' : r.paid > 0 ? '<span class="tag c-orange">صرف جزئي</span>' : '<span class="tag c-red">لم يُصرف</span>';
  const dues = tbl(['العيادة', 'اسم الطبيب', 'كشف', 'متنوع', 'إيرادات', 'الضرائب', 'المستحق', 'المدفوع', 'الباقي', 'الحالة'],
    [...rows.map(r => [cl(r), dn(r), fmtN(r.kosf), fmtN(r.mixed), fmtN(r.rev), fmtN(r.tax), b(fmtN(r.due)), fmtN(r.paid), b(fmtN(r.rest)), tag(r)]),
     [b('الإجمالي'), '', b(fmtN(T('kosf'))), b(fmtN(T('mixed'))), b(fmtN(T('rev'))), b(fmtN(T('tax'))), b(fmtN(T('due'))), b(fmtN(T('paid'))), b(fmtN(T('rest'))), ''],
     [b('إجمالي رصيد مستحق'), '', '', '', '', '', '', '', b(fmtN(T('rest'))), '']]);
  return {detail, dues, rows};
}

<script>
/* ============ نوافذ التفاصيل عند الضغط على الكروت + تقرير الإجماليات التفصيلي ============ */
'use strict';
const opsRevenue = (f, t) => sum(opsIn(f, t), o => o.value);
function scopedVisits() {
  const {from, to} = getRange(), sc = S.scope || {}; let vs = visitsIn(from, to);
  if (sc.doctor) vs = vs.filter(v => v.doctor === sc.doctor);
  if (sc.clinic) vs = vs.filter(v => v.clinic === sc.clinic);
  if (sc.company) vs = vs.filter(v => v.company === sc.company);
  if (sc.patient) vs = vs.filter(v => v.patient === sc.patient);
  return vs;
}
const byTable = (title, arr, kf, linker) => { const g = [...groupBy(arr, kf)].sort((a, b) => sum(b[1], val) - sum(a[1], val)); return `<h4>${title}</h4>` + tbl(['البيان', 'العدد', 'القيمة'], g.map(([n, a]) => [linker ? linker(n) : esc(n), a.length, fmtN(sum(a, val))]), ['الإجمالي', arr.length, fmtN(sum(arr, val))]); };
function statementRows(from, to) {
  const vs = visitsIn(from, to), acc = accounts(from, to), opsRev = opsRevenue(from, to);
  const kosf = sum(vs.filter(v => v.visitType !== 'متنوع'), val), mixed = sum(vs.filter(v => v.visitType === 'متنوع'), val), dayRev = kosf + mixed + opsRev;
  const co = sum(vs.filter(v => v.category === 'company'), val), ins = sum(vs, discountAmt), com = sum(vs.filter(v => v.category === 'committee'), val), tax = sum(vs, v => v.tax);
  const due = sum(acc, r => r.right + r.ops), paid = docPaid(from, to), expO = expOther(from, to), net = dayRev - co - ins - com - paid - expO;
  return {rows: [['إيراد الكشف', kosf], ['إيراد متنوع', mixed], ['إيراد العمليات', opsRev], ['إجمالي إيراد اليوم', dayRev], ['الشركات', -co], ['التأمين (قيمة نسبة الخصم فقط)', -ins], ['اللجنة', -com], ['المدفوع للأطباء فعلياً', -paid], ['المصروفات (بخلاف الأطباء)', -expO], ['الصافي', net], ['الضريبة', tax]],
    memo: [['مستحقات الأطباء (إجمالي المستحق)', due], ['المدفوع منها', paid], ['المتبقي بدون صرف (غير مخصوم من الصافي)', due - paid]], net, tax, dayRev, kosf, mixed, opsRev, due, paid, expO, gross: kosf + mixed};
}
function kpiDetail(label, value) {
  const {from, to} = getRange(), vs = scopedVisits(), sc = S.scope || {}, scoped = Object.keys(sc).some(k => sc[k]);
  const L_ = label;
  let body = '';
  if (/مدفوع/.test(L_)) { const p = S.data.expenses.filter(x => x.doctor && payDay(x) >= from && payDay(x) <= to); body = tbl(['عن يوم', 'الطبيب', 'المبلغ', 'ملاحظات'], p.map(x => [esc(payDay(x)), L.doctor(x.doctor), fmtN(x.amount), esc(x.notes)]), ['', 'الإجمالي', fmtN(sum(p, x => x.amount)), '']); }
  else if (/إيراد الكشف|إيراد متنوع/.test(L_)) { const mx = /متنوع/.test(L_); const a = vs.filter(v => mx ? v.visitType === 'متنوع' : v.visitType !== 'متنوع'); body = byClinicDoc(a) + byTable('حسب البيان', a, v => v.service || '(بدون بيان)'); }
  else if (/إيراد اليوم/.test(L_)) { const s = statementRows(from, to); body = tbl(['البند', 'القيمة'], s.rows.slice(0, 4).map(r => [r[0], fmtN(r[1])])) + byTable('حسب نوع الدفع', vs, v => CAT[v.category || 'cash']) + byClinicDoc(vs); }
  else if (/صافي/.test(L_)) { const s = statementRows(from, to); body = tbl(['البند', 'القيمة'], s.rows.map(r => [r[0], fmtN(r[1])])) + '<h4>مستحقات الأطباء</h4>' + tbl(['البند', 'القيمة'], s.memo.map(r => [r[0], fmtN(r[1])])); }
  else if (/مصروف|البنود/.test(L_)) { const ex = expIn(from, to).filter(x => !x.doctor); body = tbl(['البند', 'العدد', 'المبلغ'], [...groupBy(ex, x => x.category)].sort((a, b) => sum(b[1], x => x.amount) - sum(a[1], x => x.amount)).map(([n, a]) => [esc(n), a.length, fmtN(sum(a, x => x.amount))]), ['الإجمالي', ex.length, fmtN(sum(ex, x => x.amount))]); }
  else if (/ضريب/.test(L_)) body = tbl(['العيادة', 'الزيارات', 'الضريبة'], [...groupBy(vs, v => v.clinic)].map(([n, a]) => [L.clinic(n), a.length, fmtN(sum(a, v => v.tax))]), ['الإجمالي', vs.length, fmtN(sum(vs, v => v.tax))]);
  else if (/مستحق على|تحمل|الشركة|الخصم|شركات/.test(L_)) { const cv = vs.filter(v => v.category === 'company' || v.category === 'insurance'); body = tbl(['التاريخ', 'المريض', 'النوع', 'الشركة', 'القيمة', 'تحمل / خصم', 'على الجهة'], cv.map(v => [esc(v.date), L.patient(v.patient), tagCat(v.category), L.company(v.company), fmtN(v.category === 'company' ? coVal(v) : v.value), fmtN(v.category === 'company' ? coShare(v) : discountAmt(v)), fmtN(v.category === 'company' ? coDue(v) : val(v) - discountAmt(v))])); }
  else if (/حقوق|حق |نصيب|المستحق|الأطباء|متبقي/.test(L_)) { const acc = accounts(from, to).filter(r => !sc.clinic || r.clinic === sc.clinic).filter(r => !sc.doctor || r.name === sc.doctor); body = tbl(['الطبيب', 'العيادة', 'الزيارات', 'الإيراد', 'حق الطبيب', 'العمليات'], acc.map(r => [L.doctor(r.name), L.clinic(r.clinic), r.visits, fmtN(r.total), fmtN(r.right), fmtN(r.ops)]), ['الإجمالي', '', sum(acc, r => r.visits), fmtN(sum(acc, r => r.total)), fmtN(sum(acc, r => r.right)), fmtN(sum(acc, r => r.ops))]); }
  else if (/مرضى/.test(L_)) body = tbl(['المريض', 'الزيارات', 'القيمة'], [...groupBy(vs, v => v.patient)].sort((a, b) => b[1].length - a[1].length).slice(0, 15).map(([n, a]) => [L.patient(n), a.length, fmtN(sum(a, val))]));
  else if (/عمليات/.test(L_)) { const o = opsIn(from, to); body = tbl(['التاريخ', 'المريض', 'العملية', 'الطبيب', 'القيمة'], o.map(x => [esc(x.date), L.patient(x.patient), esc(x.operation), L.doctor(x.doctor), fmtN(x.value)]), ['', '', '', 'الإجمالي', fmtN(sum(o, x => x.value))]); }
  else if (/زيارات|الزيارات|عدد/.test(L_)) body = byTable('حسب نوع الزيارة', vs, v => v.visitType) + byClinicDoc(vs) + byTable('حسب نوع الدفع', vs, v => CAT[v.category || 'cash']);

  else body = '<p>لا توجد تفاصيل إضافية لهذا الكرت.</p>';
  return `<div style="min-width:min(520px,88vw)"><h3>${esc(L_)}: <b>${esc(value)}</b></h3><small>${esc(rangeLabel())}${scoped ? ' — ' + esc(Object.values(sc).filter(Boolean).join(' / ')) : ''}</small><div style="max-height:62vh;overflow:auto;margin-top:8px">${body}</div><div class="actions"><button class="btn c-teal" data-act="closemodal">إغلاق</button></div></div>`;
}

/* نافذة كرت العيادة */

  });

  const cos = [...groupBy(vs.filter(v => v.category === 'company'), v => v.company)];
  const svc = [...groupBy(vs, v => v.service || '(بدون بيان)')].sort((a, b) => sum(b[1], val) - sum(a[1], val)).slice(0, 15);

<script>

'use strict';
function duesRows(from, to) {
  const m = new Map();
  accounts(from, to).forEach(r => { let x = m.get(r.name); if (!x) m.set(r.name, x = {name: r.name, clinics: new Set(), visits: 0, total: 0, tax: 0, right: 0, ops: 0, paid: 0}); if (r.clinic) x.clinics.add(r.clinic); x.visits += r.visits; x.total += r.total; x.tax += r.tax; x.right += r.right; x.ops += r.ops; });
  S.data.expenses.filter(e => e.doctor && payDay(e) >= from && payDay(e) <= to).forEach(e => { let x = m.get(e.doctor); if (!x) m.set(e.doctor, x = {name: e.doctor, clinics: new Set(), visits: 0, total: 0, tax: 0, right: 0, ops: 0, paid: 0}); x.paid += +e.amount || 0; });
  return [...m.values()].map(x => Object.assign(x, {due: x.right + x.ops, rest: x.right + x.ops - x.paid})).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
}

<script>

'use strict';
function cashLedger(from, to) {
  const days = [...new Set([
    ...visitsIn(from, to).map(v => v.date), ...opsIn(from, to).map(o => o.date),
    ...S.data.expenses.filter(e => !e.doctor && e.date >= from && e.date <= to).map(e => e.date),
    ...S.data.expenses.filter(e => e.doctor && payDay(e) >= from && payDay(e) <= to).map(e => payDay(e))])].sort();
  const lines = []; // {kind:'rev'|'exp'|'day'|'tot', cells:[...], nums:{}}
  const NK = ['kosf', 'mixed', 'rev', 'co', 'com', 'tax', 'ins', 'amount', 'due', 'fixed', 'paid'];
  const zero = () => Object.fromEntries(NK.map(k => [k, 0]));
  const grand = zero();
  const add = (acc, o) => NK.forEach(k => { acc[k] += +o[k] || 0; });
  days.forEach(d => {
    const dsum = zero(), dn = dayName(d);
    detailSections(d, d).rows.forEach(r => {
      const doc = r.kind === 'v' ? (r.vs[0] && findDoctor(r.vs[0])) : (S.data.doctors.find(x => x.name === r.d) || null);
      const pct = doc ? (r.kind === 'v' ? +doc.percent || 0 : (r.kind === 'o' ? +doc.opPercent || 0 : '')) : '';
      const cov = r.kind === 'v' ? r.vs.filter(v => v.category === 'company') : [];
      const o = {kosf: r.kosf, mixed: r.mixed, rev: r.rev, co: r.co, com: r.com, tax: r.tax, ins: r.ins, amount: 0, due: r.due, fixed: r.kind === 'v' && doc ? +doc.fixed || 0 : 0, paid: r.paid};
      add(dsum, o);
      lines.push({kind: 'rev', o, cells: {day: dn, date: d, spec: r.c, doctor: r.d === '—' ? '' : r.d, doc1: [...new Set(cov.map(v => v.formNo).filter(Boolean))].join('، '), co: [...new Set(cov.map(v => v.company).filter(Boolean))].join('، '), pct}});
    });
    S.data.expenses.filter(e => !e.doctor && e.date === d).forEach(e => {
      const o = Object.assign(zero(), {amount: +e.amount || 0}); add(dsum, o);
      lines.push({kind: 'exp', o, cells: {day: dn, date: d, bayan: e.notes || e.category || '', doc2: e.docNo || '', notes: e.category || ''}});
    });
    add(grand, dsum); lines.push({kind: 'day', o: dsum, cells: {date: d}});
  });
  return {lines, grand, days};
}

  };

      else if (l.kind === 'exp') rows.push([c.day, c.date, '', '', '', '', '', '', '', '', '', '', '', N(o.amount), c.bayan, c.doc2, c.notes, '', '', '', '']);
      else rows.push(['إجمالي اليوم', c.date, '', N(o.kosf), N(o.mixed), N(o.rev), N(o.co), N(o.com), N(o.tax), N(o.ins), '', '', '', N(o.amount), '', '', '', '', N(o.due), '', N(o.paid)]); });
    rows.push(['الإجمالي', '', '', N(grand.kosf), N(grand.mixed), N(grand.rev), N(grand.co), N(grand.com), N(grand.tax), N(grand.ins), '', '', '', N(grand.amount), '', '', '', '', N(grand.due), '', N(grand.paid)]);

<script>
/* ============ تحليل إيرادات العيادة: دفتر الخزينة + الإيرادات غير المحصلة + العهد والسلف + تحليل المصروفات ============ */
'use strict';
const jnorm = s => String(s || '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/[ةه]/g, 'ه').replace(/[ـ\s()\-/]/g, '');
/* مجموعات أعمدة المصروفات: [المجموعة, [[العمود، [أسماء البنود المقبولة]]]] */
const JGROUPS = [
  ['تجهيزات طبية وأخرى', [['تجهيزات طبية وأخرى', ['تجهيزات طبيه وأخرى']]]],
  ['مصروفات محطة المياه', [['مصروفات محطة المياه', ['مصروفات محطة المياه']]]],
  ['مصروفات السيارة', [['بنزين', ['بنزين']], ['زيت', ['زيت']], ['صيانة', ['صيانه', 'صيانة السيارة']], ['تراخيص ورسوم وكارتات وجراج', ['تراخيص ورسوم وكارتات وجراج', 'تراخيص ورسوم']]]],
  ['مصروفات نقل', [['مصروفات نقل', ['مصاريف نقل', 'مصروفات نقل']]]],
  ['مصروفات مولد الكهرباء', [['جاز', ['جاز']], ['صيانة', ['صيانة المولد', 'صيانه مولد']]]],
  ['مصروفات المصعد', [['مصروفات المصعد', ['مصروفات المصعد']]]],
  ['رسوم تراخيص طبية ونفايات', [['رسوم تراخيص طبية ونفايات', ['رسوم تراخيص طبيه', 'رسوم تراخيص طبية ونفايات']]]],
  ['انتقالات', [['انتقالات', ['انتقالات']]]],
  ['اتصالات وتليفون وانترنت', [['اتصالات وتليفون وانترنت', ['اتصالات وتليفون وانترنت']]]],
  ['الدعاية والمطبوعات والأدوات الكتابية', [['دعايا', ['دعايا']], ['مطبوعات', ['مطبوعات']], ['أدوات كتابية', ['أدوات كتابيه']]]],
  ['البوفيه والضيافة', [['بوفيه', ['بوفيه', 'بوفية']], ['بدل ضيافة', ['بدل ضيافه']]]],
  ['مصروفات نظافة', [['مصروفات نظافة', ['مصروفات نظافه']]]],
  ['نثريات وإكراميات ومصروفات أخرى', [['نثريات وإكراميات ومصروفات أخرى', ['نثريات وإكراميات ومصروفات أخرى', 'مصاريف متنوعة', 'مصاريف تشغيل']]]],
  ['مصروفات الصيانة', [['كهرباء', ['كهرباء']], ['سباكة', ['سباكه']], ['نجارة وألوميتال ودهانات', ['نجاره ودهانات', 'نجاره والوميتال ودهانات']], ['أجهزة كهربائية', ['اجهزة كهربائيه']]]],
  ['إيصالات كهرباء', [['إيصالات كهرباء', ['إيصالات كهرباء']]]],
  ['إيصال مياه', [['إيصال مياه', ['إيصال مياه']]]],
  ['إيصالات تأمينات وضرائب', [['إيصالات تأمينات وضرائب', ['إيصال ضرائب', 'إيصالات تأمينات وضرائب']]]],
  ['مصروفات المستلزمات الطبية', [['صيانة أجهزة طبية', ['صيانة أجهزه طبيه']], ['معمل لاب تولاب', ['معمل لاب تولاب']], ['مستلزمات معمل', ['مستلزمات معمل']], ['تركيبات أسنان', ['تركيبات أسنان']], ['مستلزمات أسنان', ['مستلزمات أسنان']], ['مستلزمات طبية وأدوية', ['مستلزمات طبيه وأدويه']]]],
  ['الأجور والمرتبات', [['مرتبات الموظفين والعمال', ['مرتبات الموظفين والعمال']], ['أجور الأطباء والتمريض', ['اجور الأطباء والتمريض', 'مستحقات أطباء']], ['مكافآت', ['مكافآت', 'مكأفات', 'مكأفات عمليات']], ['بدلات', ['بدلات']], ['حوافز', ['حوافز']]]],
  ['مصروفات التأمين الصحي', [['مصروفات التأمين الصحي', ['مصروفات التأمين الصحي']]]]

const JLEAVES = []; JGROUPS.forEach(([g, cols]) => cols.forEach(([l, al]) => JLEAVES.push({g, l, al: al.map(jnorm)})));
const JOTHER = JLEAVES.findIndex(x => x.l === 'نثريات وإكراميات ومصروفات أخرى'), JDOC = JLEAVES.findIndex(x => x.l === 'أجور الأطباء والتمريض');
const jleaf = cat => { const k = jnorm(cat), i = JLEAVES.findIndex(x => x.al.includes(k)); return i >= 0 ? i : JOTHER; };

function journalLedger(from, to) {
  const ents = [], dates = new Set();
  const mk = (date, ord, o) => { ents.push(Object.assign({date, ord, in: 0, out: 0, co: 0, refund: 0, com: 0, tax: 0, ins: 0, cd: 0, cc: 0, ex: {}, bayan: '', op: '', doc: '', note: ''}, o)); dates.add(date); };
  const vsAll = S.data.visits.filter(v => v.date <= to), opsAll = S.data.operations.filter(o => o.date <= to);
  [...new Set([...vsAll.map(v => v.date), ...opsAll.map(o => o.date)])].forEach(d => {
    const vs = vsAll.filter(v => v.date === d), ops = opsAll.filter(o => o.date === d);
    const rev = sum(vs, val) + sum(ops, o => o.value), co = sum(vs.filter(v => v.category === 'company'), val), com = sum(vs.filter(v => v.category === 'committee'), val), ins = sum(vs, discountAmt), tax = sum(vs, v => v.tax);
    mk(d, 0, {bayan: 'إيرادات العيادة', op: 'إيراد', note: `${vs.length} زيارة${ops.length ? ' + ' + ops.length + ' عملية' : ''}`, in: rev - co - com - ins, co, com, ins, tax});
  });
  S.data.expenses.filter(e => e.date <= to).forEach(e => {
    const amt = +e.amount || 0;
    if (e.doctor) mk(e.date, 2, {bayan: e.doctor, op: 'صرف طبيب', doc: e.docNo || '', note: e.notes || '', out: amt, ex: {[JDOC]: amt}});
    else if (jnorm(e.category) === jnorm('الرد النقدي')) mk(e.date, 1, {bayan: e.category, op: 'رد نقدي', doc: e.docNo || '', note: e.notes || '', out: amt, refund: amt});
    else mk(e.date, 1, {bayan: e.category || '', op: 'مصروف', doc: e.docNo || '', note: e.notes || '', out: amt, ex: {[jleaf(e.category)]: amt}});
  });
  S.data.custody.filter(c => c.date <= to).forEach(c => { const amt = +c.amount || 0, give = c.dir === 'out'; mk(c.date, 3, {bayan: `${c.kind || 'عهدة'} — ${c.person || ''}`, op: give ? 'صرف عهدة/سلفة' : 'رد عهدة/سلفة', doc: c.docNo || '', note: c.notes || '', out: give ? amt : 0, in: give ? 0 : amt, cd: give ? amt : 0, cc: give ? 0 : amt}); });
  ents.sort((a, b) => a.date.localeCompare(b.date) || a.ord - b.ord);
  let bal = 0, cbal = 0; const rows = []; let open = null;
  ents.forEach(e => { if (!open && e.date >= from) open = {bal, cbal}; bal += e.in - e.out; cbal += e.cd - e.cc; e.bal = bal; e.cbal = cbal; if (e.date >= from) rows.push(e); });
  if (!open) open = {bal, cbal};
  return {rows, open, close: {bal, cbal}};
}

SCREEN_RENDER.rep_journal = async function () {
  if (!can('rep_journal')) { $('#main').innerHTML = '<div class="panel">⛔ لا تملك صلاحية هذا التقرير</div>'; return; }
  const main = $('#main'); let showAll = false;
  const build = () => {
    const {from, to} = getRange(), L_ = journalLedger(from, to), rows = L_.rows;

  function saveBlob(blob, name) {
    if (window.AndroidBridge && window.AndroidBridge.saveFile) {
      const fr = new FileReader(); fr.onload = () => window.AndroidBridge.saveFile(name, blob.type, String(fr.result).split(',')[1]); fr.readAsDataURL(blob); return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  Acts.xlsx = () => {
    const title = pageTitle().replace(/^[^؀-ۿA-Za-z0-9]+/, '');
    let sheets = S.view && S.view.exportData ? S.view.exportData() : domSheets($('#main'), title.slice(0, 24));
    if (!sheets.length) return toast('لا توجد بيانات للتصدير', true);
    const meta = [[CENTER], [title], [S.view && S.view.noRange ? '' : rangeLabel()], ['تاريخ التصدير: ' + today() + ' — ' + (S.user ? S.user.username : '')], []];
    sheets = sheets.map(s => ({name: s.name, rows: [...meta.map(r => r.slice()), ...s.rows], headRows: meta.length + 1}));
    saveBlob(xlsx(sheets), `${title.replace(/[\\/:*?"<>|]/g, ' ').trim()}-${stamp()}.xlsx`); toast('تم تجهيز ملف Excel');
  };
  /* ---- الطباعة: بنود وتقارير فقط على A4 (ليست صفحات البرنامج) ---- */
  const PRINT_CSS = (land) => `@page{size:A4 ${land ? 'landscape' : 'portrait'};margin:10mm}*{box-sizing:border-box;font-family:"Times New Roman",Times,serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:#fff;direction:rtl;font-size:12px}.hd{text-align:center;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px}.hd h2{margin:0;font-size:18px}.hd h3{margin:2px 0;font-size:14px}.hd div{font-size:11px}
table{width:100%;border-collapse:collapse;margin:6px 0;page-break-inside:auto}tr{page-break-inside:avoid}th,td{border:1px solid #000;padding:3px 5px;text-align:center;font-size:11px;vertical-align:middle}th{background:#e9e9e9}tfoot td{font-weight:bold;background:#f3f3f3}
.sect h2,h2.s{font-size:14px;margin:10px 0 2px;border-right:4px solid #000;padding-right:6px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:6px 0}.kpi{border:1px solid #000;padding:4px;text-align:center;border-radius:4px}.kpi *{font-size:11px}
img{max-height:28px}svg{max-width:100%;height:auto}.slip td:first-child{width:32%;font-weight:bold;background:#f3f3f3}.slip td{text-align:right;font-size:13px;padding:5px 8px}.sign{display:flex;justify-content:space-between;margin-top:34px;font-size:12px}`;
  function printDoc(title, sub, bodyHTML, land) {
    const doc = `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${PRINT_CSS(land)}</style></head><body><div class="hd"><h2>${esc(CENTER)}</h2><h3>${esc(title)}</h3><div>${esc(sub)}</div></div>${bodyHTML}</body></html>`;
    if (window.AndroidBridge) { // الأندرويد يطبع الـ WebView: نستبدل المحتوى مؤقتاً
      const root = $('#app'), keep = root.innerHTML, st = document.createElement('style'); st.textContent = PRINT_CSS(land).replace(/\*\{[^}]*\}/, ''); document.head.appendChild(st);
      root.innerHTML = `<div class="hd"><h2>${esc(CENTER)}</h2><h3>${esc(title)}</h3><div>${esc(sub)}</div></div>${bodyHTML}`;
      let done = false; const back = () => { if (done) return; done = true; st.remove(); root.innerHTML = keep; render(); };
      window.AndroidBridge.print(); setTimeout(back, 4000); return;
    }
    const fr = document.createElement('iframe'); fr.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0'; document.body.appendChild(fr);
    const d = fr.contentDocument; d.open(); d.write(doc); d.close();
    const go = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('تعذرت الطباعة', true); } setTimeout(() => fr.remove(), 60000); };
    setTimeout(go, 350);
  }
  function cleanContent() {
    const m = $('#main').cloneNode(true);
    m.querySelectorAll('.pagehead,form,.bar,.noprint,.cards,.modal,input,select,textarea,script,.imgfld,[data-rangebar]').forEach(n => n.remove());
    m.querySelectorAll('.printhead').forEach(n => n.remove());
    m.querySelectorAll('button').forEach(bt => { if (bt.classList.contains('btn') || bt.dataset.act === 'kpi') bt.remove(); else bt.replaceWith(document.createTextNode(bt.textContent)); });
    m.querySelectorAll('table').forEach(t => { // حذف عمود الأزرار (رأس فارغ)
      const ths = [...t.querySelectorAll('thead th')]; ths.forEach((th, i) => { if (!th.textContent.trim()) { t.querySelectorAll('tr').forEach(r => { const c = r.children[i]; if (c && (c.tagName === 'TH' || !c.textContent.trim() || r.closest('tfoot'))) c.remove(); }); } });
    });
    m.querySelectorAll('.tbl-wrap').forEach(w => { w.style.overflow = 'visible'; });
    const land = [...m.querySelectorAll('table')].some(t => (t.querySelector('tr') || {children: []}).children.length > 7);
    return {html: m.innerHTML, land};
  }
  Acts.pdf = () => {
    const {html, land} = cleanContent(), title = pageTitle().replace(/^[^؀-ۿA-Za-z0-9]+/, '');
    printDoc(title, `${S.view && S.view.noRange ? '' : rangeLabel()} — طُبع في ${today()} بواسطة ${S.user ? S.user.username : ''}`, html, land);
  };
  /* طباعة بند واحد (إيصال/بطاقة) من أي شاشة إدخال */
  Acts.prow = el => {
    const cfg = (window.CRUDS || {})[el.dataset.e], r = cfg && S.data[cfg.ent].find(x => x.id === el.dataset.id); if (!r) return;
    const rows = cfg.fields.filter(f => f.l && !['html', 'img'].includes(f.t) && !f.k.startsWith('_') || f.k === '_doc').map(f => {
      let v = f.k === '_doc' ? r.doctor : r[f.k]; if (v == null || v === '') return ''; if (f.t === 'chk') v = v ? 'نعم' : 'لا'; if (f.t === 'seg') { const o = f.opts.find(x => x.v === v); v = o ? o.l : v; }
      return `<tr><td>${esc(f.l)}</td><td>${esc(v)}</td></tr>`;
    }).join('');
    const extra = r.registeredBy ? `<tr><td>سجّله</td><td>${esc(r.registeredBy)}</td></tr>` : '';
    printDoc(cfg.t.replace(/\s*\(.*\)/, '') + (r.serial ? ` — رقم ${r.serial}` : ''), `طُبع في ${today()} بواسطة ${S.user ? S.user.username : ''}`, `<table class="slip"><tbody>${rows}${extra}</tbody></table><div class="sign"><span>توقيع المسؤول: ........................</span><span>توقيع المستلم: ........................</span></div>`, false);
  };
  Acts.print = Acts.pdf;
  window.exportButtons = '<button class="btn sm c-lime" data-act="xlsx">📗 Excel</button><button class="btn sm c-red" data-act="pdf">📄 PDF</button><button class="btn sm c-gold" data-act="pdf" title="الطباعة أو الحفظ كـ PDF">🖨️ طباعة</button>';
})();

</script>
